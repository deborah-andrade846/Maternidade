<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chá de bebê</title>
<meta name="description" content="Lista de presentes do chá de bebê.">
<meta name="theme-color" content="#f3f2f2">
<link rel="icon" href="icon-192-v2.png">
<style>
/* Mesmos tokens do app — aqui a fonte é a serifada do próprio aparelho,
   para a página abrir rápido no 3G da casa de qualquer convidado. */
:root{
  --bg:#f3f2f2; --surface:#eae9e9; --texto:#201e1d;
  --acento:#0088b0; --acento-2:#d6006c;
  --n300:#d7d3d3; --n400:#bab6b6; --n500:#9b9797; --n600:#7d7979; --n700:#605d5d;
  --a100:#e9f8ff; --a200:#cbeeff; --a700:#006786;
  --m100:#fff1f4; --m700:#aa0b56;
  --r-sm:12px; --r-md:18px; --r-lg:26px;
  --sombra:0 6px 18px rgba(10,48,62,.10);
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--texto);font-family:var(--serif);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
button,input{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}

.folha{max-width:560px;margin:0 auto;padding:max(24px,env(safe-area-inset-top,0px)) 22px 60px}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--a700)}
.kicker.n{color:var(--n500)}
h1{font-size:34px;line-height:1.05;margin:10px 0 0;font-weight:600;letter-spacing:-.01em}
h2{font-size:20px;line-height:1.2;margin:0;font-weight:600}
.sub{color:var(--n600);margin-top:10px}
.capa{background:linear-gradient(155deg,var(--a100),var(--bg) 70%);border-radius:var(--r-lg);
  padding:22px;box-shadow:var(--sombra)}
.quando{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pill{background:var(--bg);border-radius:99px;padding:5px 14px;font-size:13.5px;color:var(--n700);
  box-shadow:var(--sombra)}
.secao{margin-top:34px}
.faixa{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--n500);margin-bottom:12px}
.presente{display:flex;gap:14px;align-items:flex-start;background:var(--bg);border-radius:var(--r-md);
  padding:14px 16px;box-shadow:var(--sombra);margin-bottom:12px}
.presente .corpo{flex:1;min-width:0}
.presente .nome{font-weight:600;font-size:17px;line-height:1.25}
.presente .det{font-size:13px;color:var(--n600);margin-top:2px}
.presente.pego{background:var(--surface);box-shadow:none}
.presente.pego .nome{color:var(--n600);text-decoration:line-through}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;
  font-size:14px;line-height:1.2;padding:10px 16px;border-radius:var(--r-sm);white-space:nowrap}
.btn-primario{background:var(--acento);color:var(--bg)}
.btn-primario:active{background:var(--a700)}
.btn-linha{border:1px solid var(--acento);color:var(--acento);background:transparent}
.btn-bloco{width:100%;margin-top:12px}
.btn[disabled]{opacity:.5;cursor:default}
.marca{font-size:12.5px;color:var(--m700);background:var(--m100);border-radius:99px;padding:3px 10px;
  display:inline-block;white-space:nowrap}
.campo{display:block;margin-top:12px}
.campo span{display:block;font-size:12px;color:var(--n600);margin-bottom:5px}
.campo input{width:100%;min-height:44px;padding:8px 12px;background:var(--surface);
  border:1px solid rgba(32,30,29,.16);border-radius:var(--r-sm);font-size:16px}
.campo input:focus{border-color:var(--acento);outline:none}
.cartao{background:var(--bg);border-radius:var(--r-md);padding:16px;box-shadow:var(--sombra)}
.cartao.rosa{background:linear-gradient(155deg,var(--m100),var(--bg) 70%)}
.recado{font-size:14px;color:var(--n700);margin-top:6px}
.linhaquem{display:flex;justify-content:space-between;gap:10px;align-items:baseline;
  padding:10px 0;border-bottom:1px solid rgba(32,30,29,.10)}
.linhaquem:last-child{border-bottom:none}
.aviso{background:var(--surface);border-radius:var(--r-md);padding:16px;color:var(--n700);font-size:14.5px}
.rodape{margin-top:44px;text-align:center;font-size:12.5px;color:var(--n500)}

/* folha de rosto do formulário de reserva */
.tampa{position:fixed;inset:0;background:rgba(32,30,29,.45);display:flex;align-items:flex-end;
  justify-content:center;z-index:9;padding:0}
.folhinha{background:var(--bg);width:100%;max-width:560px;border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:24px 22px max(24px,env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto}
@media (min-width:600px){
  .tampa{align-items:center;padding:20px}
  .folhinha{border-radius:var(--r-lg)}
}
</style>
</head>
<body>
<div class="folha" id="tela">
  <div class="aviso">Abrindo a lista…</div>
</div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════
   Página do chá de bebê — o que o convidado abre pelo link.
   Fala só com a função nb-cha, que enxerga apenas os dados do chá.
   ══════════════════════════════════════════════════════════════════ */
const API = "https://zhivwbnnupjrdizmnpgy.supabase.co/functions/v1/nb-cha";
const CODIGO = (new URLSearchParams(location.search).get("c") || location.hash.replace("#", "") || "")
  .trim().toLowerCase().slice(0, 16);

let cha = null, carregando = false, folha = null;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
const BRL = v => "R$ " + Number(v || 0).toLocaleString("pt-BR", { maximumFractionDigits: 0 });
const plural = (n, s, p) => n === 1 ? s : (p || s + "s");

async function chamar(corpo){
  const r = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ codigo: CODIGO, ...corpo }),
  });
  const dados = await r.json().catch(() => ({}));
  if(!r.ok) throw Object.assign(new Error(dados.erro || "erro"), { erro: dados.erro, status: r.status });
  return dados;
}

/* ── as faixas de preço, para o convidado achar o que cabe no bolso ── */
const FAIXAS = [
  { rot: "Até R$ 50",        min: 0,   max: 50 },
  { rot: "R$ 50 a R$ 150",   min: 50,  max: 150 },
  { rot: "R$ 150 a R$ 400",  min: 150, max: 400 },
  { rot: "Acima de R$ 400",  min: 400, max: Infinity },
];

function desenhar(){
  const tela = document.getElementById("tela");
  if(!cha){
    tela.innerHTML = `<div class="capa"><div class="kicker">Chá de bebê</div>
      <h1>Lista não<br>encontrada</h1>
      <p class="sub">Confira o link com quem te convidou — talvez ele tenha sido trocado.</p></div>`;
    return;
  }
  const reservados = new Set(cha.reservas.map(r => r.item));
  const presentes = cha.presentes || [];
  const livres = presentes.filter(p => !reservados.has(p.id));
  const vao = cha.presencas.filter(p => p.vai);
  const pessoas = vao.reduce((s, p) => s + (p.pessoas || 1), 0);
  const recados = [...cha.reservas.filter(r => r.recado), ...cha.presencas.filter(p => p.recado)];

  tela.innerHTML = `
  <div class="capa">
    <div class="kicker">Chá de bebê</div>
    <h1>${esc(cha.titulo || "Chá de bebê")}</h1>
    ${cha.quando || cha.onde ? `<div class="quando">
      ${cha.quando ? `<span class="pill">📅 ${esc(cha.quando)}</span>` : ""}
      ${cha.onde   ? `<span class="pill">📍 ${esc(cha.onde)}</span>` : ""}
    </div>` : ""}
    ${cha.recado ? `<p class="sub">${esc(cha.recado)}</p>` : ""}
    ${cha.aberto ? `<button class="btn btn-primario btn-bloco" data-acao="presenca">
        Confirmar presença</button>` : ""}
    ${vao.length ? `<p class="sub" style="margin-top:12px">${vao.length}
      ${plural(vao.length, "pessoa confirmou", "pessoas confirmaram")} · ${pessoas}
      ${plural(pessoas, "vai", "vão")} ao chá</p>` : ""}
  </div>

  ${!cha.aberto ? `<div class="secao"><div class="aviso">
    A lista está fechada no momento. Fale com a mamãe. 💕</div></div>` : ""}

  ${presentes.length ? FAIXAS.map(f => {
    const itens = livres.filter(p => p.preco >= f.min && p.preco < f.max);
    if(!itens.length) return "";
    return `<div class="secao">
      <div class="faixa">${f.rot}</div>
      ${itens.map(p => `
        <div class="presente">
          <div class="corpo">
            <div class="nome">${esc(p.nome)}</div>
            <div class="det">${p.qtd > 1 ? `${p.qtd} unidades · ` : ""}${
              p.tam ? `tam ${esc(p.tam)} · ` : ""}cerca de ${BRL(p.preco)}</div>
          </div>
          ${cha.aberto ? `<button class="btn btn-linha" data-acao="reservar" data-item="${esc(p.id)}"
            data-nome="${esc(p.nome)}">Eu levo</button>` : ""}
        </div>`).join("")}
    </div>`;
  }).join("") : `<div class="secao"><div class="aviso">
    A lista de presentes ainda está sendo montada. Volte daqui a pouco. 💕</div></div>`}

  ${reservados.size ? `<div class="secao">
    <div class="faixa">Já escolhidos</div>
    ${presentes.filter(p => reservados.has(p.id)).map(p => {
      const r = cha.reservas.find(x => x.item === p.id);
      return `<div class="presente pego">
        <div class="corpo">
          <div class="nome">${esc(p.nome)}</div>
          <div class="det">${esc(r ? r.quem : "")} já vai levar</div>
        </div>
      </div>`;
    }).join("")}
  </div>` : ""}

  ${cha.aberto ? `<div class="secao">
    <div class="faixa">Não achou o que queria?</div>
    <div class="cartao rosa">
      <h2>Sugerir um presente</h2>
      <p class="sub" style="margin-top:6px">Escreva o que você pensou em levar — a mamãe vê no
        app dela e coloca na lista.</p>
      <button class="btn btn-primario btn-bloco" data-acao="sugerir">Sugerir</button>
    </div>
  </div>` : ""}

  ${cha.sugestoes.length ? `<div class="secao">
    <div class="faixa">Sugestões de outros convidados</div>
    <div class="cartao">
      ${cha.sugestoes.map(s => `<div class="linhaquem">
        <span>${esc(s.oque)}</span><span class="marca">${esc(s.quem)}</span></div>`).join("")}
    </div>
  </div>` : ""}

  ${recados.length ? `<div class="secao">
    <div class="faixa">Recadinhos</div>
    <div class="cartao">
      ${recados.map(r => `<div style="padding:10px 0">
        <span class="marca">${esc(r.quem)}</span>
        <div class="recado">${esc(r.recado)}</div></div>`).join("")}
    </div>
  </div>` : ""}

  ${vao.length ? `<div class="secao">
    <div class="faixa">Quem já confirmou</div>
    <div class="cartao">
      ${vao.map(p => `<div class="linhaquem"><span>${esc(p.quem)}</span>
        <span class="marca">${p.pessoas} ${plural(p.pessoas, "pessoa")}</span></div>`).join("")}
    </div>
  </div>` : ""}

  <div class="rodape">Feito com carinho no app da mamãe 🧸</div>`;
}

/* ── a folhinha que sobe de baixo para preencher nome e recado ── */
function abrirFolha(html, aoConfirmar){
  fecharFolha();
  folha = document.createElement("div");
  folha.className = "tampa";
  folha.innerHTML = `<div class="folhinha">${html}
    <button class="btn btn-primario btn-bloco" data-folha="ok">Enviar</button>
    <button class="btn btn-bloco" data-folha="fechar" style="color:var(--n600)">Cancelar</button></div>`;
  folha.addEventListener("click", async (e) => {
    if(e.target === folha || e.target.dataset.folha === "fechar") return fecharFolha();
    if(e.target.dataset.folha !== "ok") return;
    const botao = e.target;
    botao.disabled = true; botao.textContent = "Enviando…";
    const erro = await aoConfirmar(folha);
    if(erro){
      botao.disabled = false; botao.textContent = "Enviar";
      const aviso = folha.querySelector("[data-erro]");
      if(aviso) aviso.textContent = erro;
      return;
    }
    fecharFolha();
  });
  document.body.appendChild(folha);
  const primeiro = folha.querySelector("input");
  if(primeiro) primeiro.focus();
}
function fecharFolha(){
  if(folha) folha.remove();
  folha = null;
}
const campo = (id, rot, ph, tipo = "text") =>
  `<label class="campo"><span>${rot}</span>
    <input id="${id}" placeholder="${ph}" type="${tipo}" autocomplete="${
      id === "quem" ? "name" : "off"}" maxlength="120"></label>`;
const lembrarNome = () => { try { return localStorage.getItem("cha-quem") || ""; } catch(e){ return ""; } };
const guardarNome = n => { try { localStorage.setItem("cha-quem", n); } catch(e){} };

const MENSAGEM = {
  "ja-reservado": "Alguém escolheu esse presente antes de você. Escolha outro. 💕",
  "fechado": "A lista foi fechada pela mamãe.",
  "cheio": "A lista está cheia. Fale direto com a mamãe.",
  "nao-encontrado": "Lista não encontrada — confira o link.",
  "campos": "Preencha seu nome.",
};
const recado = e => MENSAGEM[e && e.erro] || "Não consegui enviar. Tente de novo em instantes.";

document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-acao]");
  if(!el || carregando) return;
  const acao = el.dataset.acao;

  if(acao === "reservar"){
    abrirFolha(`
      <div class="kicker">Eu levo</div>
      <h2 style="margin-top:8px">${esc(el.dataset.nome)}</h2>
      <p class="sub" style="margin-top:6px">Assim ninguém repete o presente.</p>
      ${campo("quem", "Seu nome", "ex: Tia Lu")}
      ${campo("recado", "Recadinho (opcional)", "uma mensagem para a mamãe")}
      <p class="sub" data-erro style="color:var(--m700)"></p>`,
      async (f) => {
        const quem = f.querySelector("#quem").value.trim();
        if(!quem) return "Escreva seu nome.";
        guardarNome(quem);
        try {
          cha = await chamar({ acao: "reservar", item: el.dataset.item, quem,
            recado: f.querySelector("#recado").value.trim() });
          desenhar();
          return null;
        } catch(erro){
          if(erro.erro === "ja-reservado"){ await recarregar(); }
          return recado(erro);
        }
      });
    const nome = lembrarNome();
    if(nome) folha.querySelector("#quem").value = nome;
    return;
  }

  if(acao === "presenca"){
    abrirFolha(`
      <div class="kicker">Presença</div>
      <h2 style="margin-top:8px">Você vai ao chá?</h2>
      <p class="sub" style="margin-top:6px">A mamãe vê a confirmação no app dela.</p>
      ${campo("quem", "Seu nome", "ex: Tia Lu")}
      ${campo("pessoas", "Quantas pessoas vão com você (contando você)", "1", "number")}
      ${campo("recado", "Recadinho (opcional)", "uma mensagem carinhosa")}
      <p class="sub" data-erro style="color:var(--m700)"></p>`,
      async (f) => {
        const quem = f.querySelector("#quem").value.trim();
        if(!quem) return "Escreva seu nome.";
        guardarNome(quem);
        try {
          cha = await chamar({ acao: "presenca", quem,
            pessoas: Number(f.querySelector("#pessoas").value) || 1,
            recado: f.querySelector("#recado").value.trim() });
          desenhar();
          return null;
        } catch(erro){ return recado(erro); }
      });
    const nome = lembrarNome();
    if(nome) folha.querySelector("#quem").value = nome;
    return;
  }

  if(acao === "sugerir"){
    abrirFolha(`
      <div class="kicker">Sugestão</div>
      <h2 style="margin-top:8px">Sugerir um presente</h2>
      <p class="sub" style="margin-top:6px">A mamãe decide se entra na lista.</p>
      ${campo("quem", "Seu nome", "ex: Tia Lu")}
      ${campo("oque", "O que você quer levar", "ex: cadeirinha de descanso")}
      <p class="sub" data-erro style="color:var(--m700)"></p>`,
      async (f) => {
        const quem = f.querySelector("#quem").value.trim();
        const oque = f.querySelector("#oque").value.trim();
        if(!quem) return "Escreva seu nome.";
        if(!oque) return "Escreva o presente que você pensou.";
        guardarNome(quem);
        try {
          cha = await chamar({ acao: "sugerir", quem, oque });
          desenhar();
          alert("Sugestão enviada! A mamãe vai ver no app dela. 💕");
          return null;
        } catch(erro){ return recado(erro); }
      });
    const nome = lembrarNome();
    if(nome) folha.querySelector("#quem").value = nome;
  }
});
document.addEventListener("keydown", (e) => { if(e.key === "Escape") fecharFolha(); });

async function recarregar(){
  if(!CODIGO){ cha = null; return desenhar(); }
  carregando = true;
  try {
    cha = await chamar({ acao: "ver" });
  } catch(e){
    cha = null;
  }
  carregando = false;
  desenhar();
}
/* volta do bolso: a lista pode ter mudado enquanto a página ficou aberta */
document.addEventListener("visibilitychange", () => { if(!document.hidden && !folha) recarregar(); });
recarregar();
</script>
</body>
</html>
