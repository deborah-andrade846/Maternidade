:root{
  --color-bg:#f3f2f2;
  --color-surface:#eae9e9;
  --color-text:#201e1d;
  --color-accent:#0088b0;
  --color-accent-2:#d6006c;
  --color-divider:color-mix(in srgb,#201e1d 16%,transparent);

  --color-neutral-100:#f8f4f4; --color-neutral-200:#eae7e7; --color-neutral-300:#d7d3d3;
  --color-neutral-400:#bab6b6; --color-neutral-500:#9b9797; --color-neutral-600:#7d7979;
  --color-neutral-700:#605d5d; --color-neutral-800:#444141; --color-neutral-900:#2d2b2b;

  --color-accent-100:#e9f8ff; --color-accent-200:#cbeeff; --color-accent-300:#99e0ff;
  --color-accent-400:#62c5ee; --color-accent-500:#38a6cf; --color-accent-600:#1186ac;
  --color-accent-700:#006786; --color-accent-800:#004961; --color-accent-900:#0a303e;

  --color-accent-2-100:#fff1f4; --color-accent-2-200:#ffdee6; --color-accent-2-300:#ffc0d0;
  --color-accent-2-400:#ff90b1; --color-accent-2-500:#ff458e; --color-accent-2-600:#d82071;
  --color-accent-2-700:#aa0b56; --color-accent-2-800:#790e3d; --color-accent-2-900:#4b1528;

  --font-heading:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-heading-weight:600;
  --font-body:"Source Serif 4",Georgia,"Times New Roman",serif;

  --space-1:5px; --space-2:10px; --space-3:15px; --space-4:20px; --space-6:30px; --space-8:40px;
  --radius-sm:12px; --radius-md:18px; --radius-lg:26px;

  --shadow-sm:0 1px 2px color-mix(in srgb,#2d2b2b 14%,transparent);
  --shadow-md:0 3px 10px color-mix(in srgb,#2d2b2b 16%,transparent);
  --shadow-lg:0 12px 32px color-mix(in srgb,#2d2b2b 22%,transparent);
  --shadow-card:0 6px 18px color-mix(in srgb,var(--color-accent-900) 10%,transparent);

  --wash-accent:linear-gradient(155deg,var(--color-accent-100),var(--color-bg) 70%);
  --wash-accent-2:linear-gradient(155deg,var(--color-accent-2-100),var(--color-bg) 70%);
}

/* — base — */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#e6e4e2;color:var(--color-text);font-family:var(--font-body);
  font-size:15px;line-height:1.55;font-weight:400;-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;align-items:flex-start;padding:32px 0;
  overflow-wrap:anywhere}
button,input{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation}
img{display:block;max-width:100%}
::selection{background:color-mix(in srgb,var(--color-accent) 30%,transparent)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
::-webkit-scrollbar{width:0;height:0}

/* — componentes do design system — */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:13px;
  line-height:1.2;color:var(--color-text);background:transparent;border:1px solid transparent;
  padding:calc(var(--space-2)*.85) var(--space-3);border-radius:var(--radius-md)}
.btn-primary{background:var(--color-accent);color:var(--color-bg)}
.btn-primary:active{background:var(--color-accent-700)}
.btn-secondary{border-color:var(--color-divider)}
.btn-secondary:active{background:color-mix(in srgb,var(--color-text) 14%,transparent)}
.btn-ghost{color:var(--color-accent);padding-inline:var(--space-1)}
.btn-icon{width:34px;height:34px;padding:0}
.btn-block{width:100%;margin-top:var(--space-2)}
.field>label{display:block;font-size:12px;margin-bottom:5px;
  color:color-mix(in srgb,var(--color-text) 70%,transparent)}
.input{width:100%;min-height:36px;padding:6px 10px;font:inherit;font-size:14px;
  color:var(--color-text);caret-color:var(--color-accent);background:var(--color-surface);
  border:1px solid var(--color-divider);border-radius:var(--radius-sm)}
.input:focus-visible{border-color:var(--color-accent);outline-offset:0}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;letter-spacing:.02em;
  padding:3px 10px;border-radius:calc(var(--radius-md)*.75);cursor:pointer;white-space:nowrap}
.tag-static{cursor:default}
.tag-accent{background:var(--color-accent-100);color:var(--color-accent-800)}
.tag-accent-2{background:var(--color-accent-2-100);color:var(--color-accent-2-800)}
.tag-neutral{background:var(--color-neutral-200);color:var(--color-neutral-800)}
.tag-outline{border:1px solid var(--color-accent);color:var(--color-accent)}

/* — moldura do app — */
.phone{width:390px;height:844px;background:var(--color-bg);position:relative;overflow:hidden;
  box-shadow:var(--shadow-lg);border-radius:var(--radius-md);flex:none}
.scroll{position:absolute;inset:0;bottom:92px;overflow-y:auto;
  padding:max(22px,env(safe-area-inset-top,0px)) 22px 24px}
.tabbar{position:absolute;left:14px;right:14px;bottom:16px;height:68px;background:var(--color-bg);
  display:flex;align-items:center;justify-content:space-around;padding:0 6px;
  border-radius:var(--radius-lg);box-shadow:var(--shadow-card);
  border:1px solid color-mix(in srgb,var(--color-text) 6%,transparent);z-index:4}
.tab{flex:1 1 0;min-width:0;height:52px;color:var(--color-neutral-500);background:none;padding:0;border-radius:var(--radius-sm);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:background .15s,color .15s}
.tab.on{color:var(--color-accent);background:var(--color-accent-100)}
.tab .lbl{font-size:9.5px;letter-spacing:.04em;text-align:center}
.overlay{position:absolute;inset:0;background:var(--color-bg);overflow-y:auto;z-index:5;
  padding:max(30px,env(safe-area-inset-top,0px)) 22px 24px}

/* — tipografia da tela — */
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-accent-700)}
.kicker-2{color:var(--color-accent-2)}
.kicker-n{color:var(--color-neutral-500)}
.h-hero{font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:36px;
  line-height:1.03;margin-top:10px;letter-spacing:-.01em}
.h-tela{font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:34px;
  line-height:1.05;margin-top:8px}
.h1{font-family:var(--font-heading);font-weight:var(--font-heading-weight)}
.muted{color:var(--color-neutral-600)}
.voltar{font-size:13px;color:var(--color-accent-700);background:none;padding:0;text-align:left}
.linha{margin-top:22px;height:5px;background:var(--color-neutral-200);position:relative;
  border-radius:99px;overflow:hidden}
.linha>i{display:block;height:5px;background:var(--color-accent);border-radius:99px}
.linha.mag>i{background:var(--color-accent-2)}
.linha.fina{margin-top:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.lista{display:grid}
.ic{width:1em;height:1em;fill:currentColor;display:block}
.tocavel{cursor:pointer;background:none;padding:0;text-align:left;width:100%;display:block}
.vazio{font-size:15px;color:var(--color-neutral-600);line-height:1.5}

/* — enxoval — */
.item-linha{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;
  background:none;padding:0;cursor:pointer}
.thumb{width:52px;height:52px;flex:0 0 52px;background:var(--color-neutral-200);
  border-radius:var(--radius-sm);position:relative;overflow:hidden}
.thumb img{position:absolute;left:50%;top:4px;transform:translateX(-50%);width:44px;opacity:.18}
.thumb .tam{position:absolute;left:0;right:0;bottom:0;background:var(--color-bg);text-align:center;
  font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:11px;
  letter-spacing:.06em;color:var(--color-neutral-700);padding:1px 0}
.foto{width:100%;height:190px;background:var(--color-neutral-200);border-radius:var(--radius-sm);
  margin-top:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;overflow:hidden}
.foto img{width:112px;object-fit:contain;opacity:.5}

/* — menu Mais — */
.menu-num{width:54px;flex:0 0 54px;position:relative;height:54px}
.menu-num .quadro{position:absolute;inset:0;background:var(--color-neutral-200);border-radius:var(--radius-sm)}
.menu-num .num{position:absolute;left:-3px;top:-3px;font-family:var(--font-heading);
  font-weight:var(--font-heading-weight);font-size:11px;letter-spacing:.1em;color:var(--color-neutral-500)}
.menu-num .ic{position:absolute;left:15px;top:15px;font-size:26px;color:var(--color-accent-700)}

/* — blocos trazidos da primeira versão, no vocabulário do Broadsheet — */
.numero{font-family:var(--font-heading);font-weight:var(--font-heading-weight);
  font-size:30px;line-height:1;letter-spacing:-.01em}
.dupla{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.pilha{display:grid;gap:6px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.dica{background:var(--wash-accent-2);border-radius:var(--radius-md);padding:14px 16px;
  display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadow-card)}
.dica .ic{color:var(--color-accent-700);flex:0 0 auto;font-size:20px;margin-top:1px}
.dica p{margin:0;font-size:13.5px;line-height:1.5;color:var(--color-neutral-700)}
.fase{display:flex;gap:16px;align-items:flex-start}
.fase-n{width:44px;flex:0 0 44px;text-align:right}
.check{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;
  background:none;padding:0;cursor:pointer}
.check .ico{width:22px;flex:0 0 22px;display:flex;justify-content:center}
.riscado{text-decoration:line-through}

/* — estados de mouse: só onde existe ponteiro, senão o toque deixa o :hover grudado — */
@media (hover:hover) and (pointer:fine){
  .btn-primary:hover{background:var(--color-accent-600)}
  .btn-secondary:hover{background:color-mix(in srgb,var(--color-text) 7%,transparent)}
  .btn-ghost:hover{background:color-mix(in srgb,var(--color-accent) 10%,transparent)}
  .input:hover{border-color:color-mix(in srgb,var(--color-text) 45%,transparent)}
  .tocavel:hover,.item-linha:hover,.check:hover{opacity:.65}
}

/* — ferramentas — */
.grade{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cartao{background:var(--color-surface);border-radius:var(--radius-md);padding:14px 15px;
  box-shadow:var(--shadow-card)}
.mini{font-size:12px;color:var(--color-neutral-500);line-height:1.4}
.barras{display:flex;align-items:flex-end;gap:5px;height:90px;margin-top:14px}
.barras>span{flex:1;background:var(--color-neutral-300);min-height:2px;
  border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.barras>span.on{background:var(--color-accent)}
.bolha{width:156px;height:156px;border-radius:50%;background:var(--color-accent-200);
  margin:0 auto;display:flex;align-items:center;justify-content:center;
  transition:transform 1s ease-in-out;font-family:var(--font-heading);
  font-weight:var(--font-heading-weight);font-size:34px;color:var(--color-accent-800)}
textarea.input{min-height:auto}

/* — início: saudação, ações rápidas, humor — */
.saudacao{background:var(--wash-accent);border-radius:var(--radius-lg);padding:20px 22px;
  box-shadow:var(--shadow-card);position:relative;overflow:hidden}
.acoes-grade{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.acao{border-radius:var(--radius-md);padding:16px;text-align:left;background:var(--wash-accent);
  box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:10px;min-height:96px}
.acao.mag{background:var(--wash-accent-2)}
.acao .ic{font-size:24px;color:var(--color-accent-700)}
.acao.mag .ic{color:var(--color-accent-2-700)}
.acao .rot{font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:14.5px;line-height:1.2;color:var(--color-text)}
.atalhos-fila{display:flex;gap:10px;overflow-x:auto;margin:18px -22px 0;padding:2px 22px 6px;
  scroll-snap-type:x proximate}
.atalhos-fila>.atalho-mini{flex:0 0 132px;width:132px;scroll-snap-align:start;
  border-radius:var(--radius-md);padding:12px 13px;background:var(--wash-accent);
  box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:6px}
.atalho-mini.mag{background:var(--wash-accent-2)}
.atalho-mini .ic{color:var(--color-accent-700)}
.atalho-mini.mag .ic{color:var(--color-accent-2-700)}
.atalho-mini .rot{font-family:var(--font-heading);font-weight:var(--font-heading-weight);
  font-size:14px;line-height:1.2;color:var(--color-text)}
.atalho-mini .mini{display:block}
.humor-fila{display:flex;justify-content:space-between;gap:6px}
.humor-fila button{flex:1;aspect-ratio:1;border-radius:var(--radius-sm);background:var(--color-surface);
  display:flex;align-items:center;justify-content:center;font-size:22px}

/* — celular de verdade: a moldura vira a tela inteira — */
@media (max-width:460px),(max-height:900px){
  body{padding:0;align-items:stretch}
  .phone{width:100%;height:100dvh;max-width:520px;box-shadow:none;border-radius:0}
}

  if(!state.presentes || Array.isArray(state.presentes)) state.presentes = {};
  if(!state.malaCheck) state.malaCheck = {};
  if(!Array.isArray(state.bolsaExtras)) state.bolsaExtras = [];
  if(!Array.isArray(state.historico))  state.historico = [];
  if(!Array.isArray(state.agenda) || !state.agenda.length) state.agenda = AGENDA.map(a=>({...a}));
  if(!Array.isArray(state.feitos))     state.feitos = [];
  if(!Array.isArray(state.nomesLista) || !state.nomesLista.length) state.nomesLista = seedNomes();
  state.nomesLista = state.nomesLista
    .map(n=>({id: n.id || novoId("n"), nome: String(n.nome ?? "").trim(),
      significado: String(n.significado ?? "").trim(), nota: String(n.nota ?? "").trim()}))
    .filter(n=>n.nome);
  if(!Array.isArray(state.nomes)) state.nomes = [];
  /* versões antigas guardavam o favorito pelo nome escrito; agora é pelo id */
  state.nomes = [...new Set(state.nomes.map(f=>{
    const n = state.nomesLista.find(x=>x.id === f) || state.nomesLista.find(x=>x.nome === f);
    return n ? n.id : null;
  }).filter(Boolean))];

  if(!Array.isArray(state.partoLista) || !state.partoLista.length) state.partoLista = seedParto();
  state.partoLista = state.partoLista
    .map(p=>({id: p.id || novoId("p"), tema: String(p.tema ?? "").trim(),
      opcoes: (Array.isArray(p.opcoes) ? p.opcoes : []).map(o=>String(o).trim()).filter(Boolean),
      escolha: String(p.escolha ?? "").trim(), nota: String(p.nota ?? "").trim()}))
    .filter(p=>p.tema);
  /* versões antigas guardavam a escolha num objeto tema → opção */
  if(state.parto && typeof state.parto === "object" && !Array.isArray(state.parto)){
    Object.entries(state.parto).forEach(([tema, escolha])=>{
      const p = state.partoLista.find(x=>x.tema === tema);
      if(!p || p.escolha || !escolha) return;
      p.escolha = String(escolha);
      if(!p.opcoes.includes(p.escolha)) p.opcoes = [...p.opcoes, p.escolha];
    });
  }
  delete state.parto;
  /* ferramentas: garante a forma de cada registro, venha de onde vier */
  const objVazio = k=>{ if(!state[k] || typeof state[k] !== "object" || Array.isArray(state[k])) state[k] = {}; };
  const arrVazio = k=>{ if(!Array.isArray(state[k])) state[k] = []; };
  ["exames","vacinas","marcos","respiros"].forEach(objVazio);
  ["chutesHist","diario","colo","sintomas","pesos","mamadas","sono","ciclos","humor"].forEach(arrVazio);
  if(!state.calc || typeof state.calc !== "object" || Array.isArray(state.calc))
    state.calc = estadoInicial().calc;
  if(!METODOS.some(m=>m[0] === state.calc.metodo)) state.calc.metodo = "dum";
  if(!state.corpo || typeof state.corpo !== "object" || Array.isArray(state.corpo))
    state.corpo = {altura:"", pesoPre:""};
  if(!state.agua || typeof state.agua !== "object" || Array.isArray(state.agua)) state.agua = {meta:0, dias:{}};
  if(!state.agua.dias || typeof state.agua.dias !== "object") state.agua.dias = {};
  if(!(state.agua.meta > 0)) state.agua.meta = 0;
  if(!state.cicloCfg || typeof state.cicloCfg !== "object" || Array.isArray(state.cicloCfg))
    state.cicloCfg = {duracao:"28", base:""};
  if(!dataValida(state.nascimento)) state.nascimento = "";
  state.humor = state.humor.filter(h=>h && dataValida(h.data)).map(h=>({id: h.id || novoId("u"),
    data:h.data, nivel: Math.max(1, Math.min(5, Math.round(Number(h.nivel)) || 3)),
    tags: (Array.isArray(h.tags) ? h.tags : []).filter(t=>HUMOR_TAGS.includes(t)),
    nota: String(h.nota ?? "")}));
  /* uma sessão esquecida aberta não pode ficar contando para sempre */
  const antiga = (sessao, horas) => !sessao || !(sessao.ini > 0) || Date.now() - sessao.ini > horas*3600000;
  if(antiga(state.chuteAtivo, 6) || !Array.isArray((state.chuteAtivo || {}).marcas)) state.chuteAtivo = null;
  if(antiga(state.mamadaAtiva, 6)) state.mamadaAtiva = null;
  if(antiga(state.sonoAtivo, 16)) state.sonoAtivo = null;

  if(!PERFIL_IDX.hasOwnProperty(state.perfil)) state.perfil = "completo";
  if(!ESTACOES.some(e=>e[0] === state.estacao)) state.estacao = "todas";
  if(!(state.bebes >= 1)) state.bebes = 1;
  if(!(state.meta > 0)) state.meta = 9000;
  if(!state.dpp) state.dpp = dppPadrao();

  /* as quantidades que versões anteriores plantavam sozinhas saem daqui — mas só
     as que continuam exatamente como vieram: o que você mesma ajustou fica */
  Object.entries(SEED_ANTIGO).forEach(([id, qtd])=>{
    const a = state.itens[id];
    if(a && a.tem === qtd) delete a.tem;
  });

  /* limpa referências a itens que não existem mais — sem tocar nos criados por você */
  Object.keys(state.itens).forEach(id=>{ if(!existe(id)) delete state.itens[id]; });
  state.favoritos = state.favoritos.filter(id=>existe(id));
  state.itemAberto = null;
  state.tela = TELAS[state.tela] ? state.tela : "home";
}

/* Traz os dados da versão anterior (enxoval em 5 categorias, itens por nome) */
function migrarV1(s){
  const porNome = {};
  CATALOGO.forEach(i=>{ porNome[i.nome.toLowerCase()] = i.id; });
  const itens = {}, extras = [];
  (s.enxoval || []).forEach(c=>(c.itens || []).forEach(i=>{
    const id = porNome[String(i.nome).toLowerCase()];
    if(id){
      itens[id] = {tem: Number(i.tem) || 0};
      if(i.preco) itens[id].preco = Number(i.preco);
      if(i.loja && i.loja !== "a definir") itens[id].loja = i.loja;
      if(i.tam && i.tam !== "—") itens[id].tam = i.tam;
    } else {
      extras.push({id:"x" + extras.length + Date.now().toString(36), nome:i.nome,
        cat: CATS.includes(c.cat) ? c.cat : CATS[0], tam:i.tam || "—", loja:i.loja || "a definir",
        preco:Number(i.preco) || 0, meta:Number(i.meta) || 1, prio: i.ess ? 1 : 3});
      itens[extras[extras.length-1].id] = {tem: Number(i.tem) || 0};
    }
  }));
  /* a lista fixa da versão anterior usava outros nomes para itens que o catálogo já tem */
  const APELIDOS = {
    "documentos e carteirinha do pré-natal":"documentos",
    "camisola com abertura na frente":"camisolaabertura",
    "absorvente pós-parto":"absorventepos",
    "chinelo e roupão":"chinelo",
    "6 bodies rn":"bodycurto",
    "6 macacões rn":"macacaomole",
    "fraldas rn + lenços":"fraldarn",
    "manta e touca":"mantacobertor",
    "saída de maternidade":"macacaosaida",
    "bebê conforto no carro":"bebeconforto",
  };
  const bolsaExtras = [], malaCheck = {};
  (s.bolsa || []).forEach(nome=>{
    const chave = String(nome).toLowerCase();
    const id = porNome[chave] || APELIDOS[chave];
    if(id && CAT_MAP[id]){ malaCheck[id] = true; }
    else { bolsaExtras.push(nome); malaCheck[nome] = true; }
  });
  const {enxoval, bolsaItens, bolsa, catAberta, ...resto} = s;
  return {...resto, itens, extras, malaCheck, bolsaExtras, catAberta:"Tudo"};
}

/* ==================================================================
   CAMADA 3 — MOTOR (funções puras: leem o estado, devolvem números)
   ================================================================== */
const BRL = n => "R$ " + Math.round(n).toLocaleString("pt-BR");
const extraMap = () => Object.fromEntries(state.extras.map(e=>[e.id, e]));

/* Um item, venha do catálogo ou tenha sido criado por você */
function item(id){
  const base = CAT_MAP[id] || state.extras.find(e=>e.id === id);
  if(!base) return null;
  const ajuste = state.itens[id] || {};
  return {...base, ...ajuste,
    tem:  Math.max(0, Number(ajuste.tem) || 0),
    preco: ajuste.preco != null ? Number(ajuste.preco) : base.preco,
    tam:  ajuste.tam  || base.tam  || "—",
    loja: ajuste.loja || base.loja || "a definir",
    oculto: !!ajuste.oculto};
}
const existe  = id => !!(CAT_MAP[id] || state.extras.some(e=>e.id === id));
const todosIds = () => [...CATALOGO.map(i=>i.id), ...state.extras.map(e=>e.id)];

/* Quantidade recomendada = perfil × estação × número de bebês */
function meta(id){
  const it = item(id);
  if(!it || it.oculto) return 0;
  if(it.meta != null) return Math.max(1, Number(it.meta));    /* item criado por você */
  let base = it.q[PERFIL_IDX[state.perfil]] || 0;
  if(base === 0) return 0;
  if(it.est !== "todas" && state.estacao !== "todas" && it.est !== state.estacao)
    base = Math.max(1, Math.round(base * .5));                /* fora de estação: metade */
  if(it.dup && state.bebes > 1) base = Math.round(base * (1 + (state.bebes-1) * .8));
  return base;
}
const tem       = id => (item(id) || {tem:0}).tem;
const falta     = id => Math.max(0, meta(id) - tem(id));
const precoDe   = id => (item(id) || {preco:0}).preco;
const custoFalta= id => falta(id) * precoDe(id);
const completo  = id => meta(id) > 0 && falta(id) === 0;
const isFav     = id => state.favoritos.includes(id);
const isOculto  = id => !!(state.itens[id] || {}).oculto;

function ativos(){ return todosIds().filter(id=>meta(id) > 0); }

function progresso(ids){
  const list = ids || ativos();
  let m = 0, ok = 0;
  list.forEach(id=>{ const q = meta(id); m += q; ok += Math.min(tem(id), q); });
  return {meta:m, ok, pct: m ? Math.round(ok/m*100) : 0,
          itensOk: list.filter(completo).length, total: list.length};
}
const progressoCat = cat => progresso(ativos().filter(id=>item(id).cat === cat));

/* O que falta, em ordem de prioridade → categoria → maior impacto */
function faltantes({cat=null, prio=null, soFav=false} = {}){
  const ordem = Object.fromEntries(CATS.map((c,i)=>[c,i]));
  return ativos()
    .filter(id=>falta(id) > 0)
    .filter(id=>!cat  || item(id).cat === cat)
    .filter(id=>!prio || item(id).prio === prio)
    .filter(id=>!soFav || isFav(id))
    .map(id=>({...item(id), id, falta:falta(id), meta:meta(id), custo:custoFalta(id)}))
    .sort((a,b)=> a.prio - b.prio || ordem[a.cat] - ordem[b.cat] || b.custo - a.custo);
}
const custoRestante = prios => faltantes()
  .filter(f=>!prios || prios.includes(f.prio)).reduce((s,f)=>s + f.custo, 0);
const valorEmCasa = () => ativos().reduce((s,id)=>s + Math.min(tem(id), meta(id)) * precoDe(id), 0);
const gastoRegistrado = () => state.historico.reduce((s,h)=>s + (Number(h.valor) || 0), 0);

/* Kits: "pronto" = quantidade recomendada de tudo; "dá para fazer" = ao menos uma de cada */
const estadoItem = id => completo(id) ? "ok" : (tem(id) > 0 ? "part" : "no");
function match(kit){
  const req = kit.req || [], opt = kit.opt || [];
  const semNenhum   = req.filter(id=>tem(id) === 0);
  const incompletos = req.filter(id=>tem(id) > 0 && !completo(id));
  const optTem      = opt.filter(id=>tem(id) > 0).length;
  const cobertura = req.length ? (req.length - semNenhum.length - incompletos.length*.4)/req.length : 1;
  return {semNenhum, incompletos, optTem,
          score: cobertura * .75 + (opt.length ? optTem/opt.length : 1) * .25,
          usavel: semNenhum.length === 0,
          completo: semNenhum.length === 0 && incompletos.length === 0};
}
function getKits({tipo=null, mode="all"} = {}){
  const out = [];
  for(const k of KITS){
    if(tipo && !k.tipo.includes(tipo)) continue;
    const m = match(k);
    if(mode === "prontos" && !m.completo) continue;
    if(mode === "usaveis" && !m.usavel) continue;
    out.push({...k, ...m});
  }
  out.sort((a,b)=> (b.completo - a.completo) || (b.usavel - a.usavel) || (b.score - a.score));
  return out;
}

/* Gestação */
function gestacao(){
  const dpp = new Date(state.dpp + "T00:00:00");
  const dias = Math.round((dpp - hoje())/86400000);

  return {dias, semana, trimestre: semana <= 13 ? "1º" : semana <= 27 ? "2º" : "3º",
          nasceu: dias < 0, pct: Math.min(100, Math.round(semana/40*100))};
}
const faseAtual = () => FASES.find(f=>gestacao().semana <= f.ate) || FASES[FASES.length-1];
const textoDaSemana = sem => (SEMANAS.slice().reverse().find(s=>s.n <= sem) || SEMANAS[0]).texto;

}

/* Mala da maternidade */

/* Chá de bebê: o que falta, por faixa de preço, sem o que já foi reservado */
function sugestoesCha(){
  const list = faltantes().filter(f=>!state.presentes[f.id]);

               .filter(f=>f.itens.length);
}

/* Próximos passos: a fase da gestação mais o que falta de essencial */
function proximasAcoes(){

/* ---------- datas e tempo ---------- */
function isoDe(d){
  const x = new Date(d);
  x.setMinutes(x.getMinutes() - x.getTimezoneOffset());
  return x.toISOString().slice(0,10);
}
const isoHoje    = () => isoDe(hoje());
const dataValida = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || "")) && !isNaN(new Date(s + "T00:00:00"));
const diasEntre  = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
function somaDias(iso, n){
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + n);
  return isoDe(d);
}
const semDia = dias => `${Math.floor(dias/7)} semanas e ${dias%7} ${plural(dias%7,"dia")}`;
const horaBR = ts => new Date(ts).toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
function duracao(ms){
  const s = Math.max(0, Math.floor(ms/1000)), h = Math.floor(s/3600), m = Math.floor(s%3600/60);
  return h ? `${h}h ${String(m).padStart(2,"0")}min` : `${m}:${String(s%60).padStart(2,"0")}`;
}
function minutosBR(min){
  const h = Math.floor(min/60);
  return h ? `${h}h ${String(min%60).padStart(2,"0")}min` : `${min} min`;
}
/* agrupa registros com campo de data em [{data, itens}], do mais novo para o mais antigo */
function porDia(lista, chave = "data"){
  const mapa = {};
  lista.forEach(r=>{ (mapa[r[chave]] = mapa[r[chave]] || []).push(r); });
  return Object.keys(mapa).sort().reverse().map(data=>({data, itens:mapa[data]}));
}

/* ---------- calculadora gestacional ---------- */
/* Devolve a DPP calculada pelo método escolhido, ou "" se faltar dado */
function dppCalculada(c = state.calc){
  if(c.metodo === "dum"){
    if(!dataValida(c.dum)) return "";
    const ajuste = Math.round(num(c.ciclo) || 28) - 28;               /* Naegele corrigida pelo ciclo */
    return somaDias(c.dum, 280 + Math.max(-14, Math.min(14, ajuste)));
  }
  if(c.metodo === "us"){
    if(!dataValida(c.usData)) return "";
    const dias = Math.round(num(c.usSem) || 0) * 7 + Math.round(num(c.usDias) || 0);
    if(dias <= 0) return "";
    return somaDias(c.usData, 280 - dias);
  }
  return dataValida(c.dpp) ? c.dpp : "";
}
/* Idade gestacional em dias numa data qualquer, a partir de uma DPP */
const idadeGest = (dpp, ref = isoHoje()) => 280 - diasEntre(ref, dpp);
function marcosGest(dpp){

    ["Fim do 2º trimestre",   somaDias(dpp,  -91), "27 semanas"],
    ["Mala pronta",           somaDias(dpp,  -42), "34 semanas"],
    ["Bebê a termo",          somaDias(dpp,  -21), "37 semanas"],

  ];
}

/* ---------- colo uterino ---------- */
function classificaColo(mm){
  if(!(mm > 0))  return {nome:"—",         cls:"tag-neutral",  texto:""};
  if(mm < 25)    return {nome:"Colo curto", cls:"tag-accent-2", texto:"Abaixo de 25 mm é considerado colo curto. Mostre esta medida para a sua equipe."};
  if(mm < 30)    return {nome:"Limítrofe",  cls:"tag-neutral",  texto:"Entre 25 e 30 mm costuma pedir um novo controle em duas semanas."};
  return {nome:"Dentro do esperado", cls:"tag-accent", texto:"Acima de 30 mm é o esperado até cerca de 24 semanas."};
}

/* ---------- IMC gestacional ---------- */
const imcDe = (peso, altura) => (peso > 0 && altura > 0) ? peso / (altura * altura) : 0;
const faixaIMC = v => IMC_FAIXAS.find(f=>v < f.ate) || IMC_FAIXAS[IMC_FAIXAS.length - 1];
const pesoAtual = () => state.pesos.length ? state.pesos[state.pesos.length - 1].peso : null;
/* Ganho esperado até a semana atual: até 13 semanas, 0,5 a 2 kg; depois, o ritmo semanal da faixa */
function ganhoEsperado(faixa, semana){
  const s = Math.max(0, Math.min(40, semana));
  if(s <= 13) return [0.5 * s/13, 2 * s/13];
  return [2 + faixa.semanal[0] * (s - 13), 2 + faixa.semanal[1] * (s - 13)];
}

/* ---------- exames e vacinas ---------- */
const exameFeito = id => !!(state.exames[id] || {}).feito;

const idadeBebeMeses = () => dataValida(state.nascimento)

const vacinaFeita = id => !!(state.vacinas[id] || {}).feita;

function dataVacina(v){

const rotuloIdade = m => m === 0 ? "Ao nascer" : (m < 12 ? `${m} meses` : `${m/12} ${plural(m/12,"ano")}`);
const IDADES_VACINA = [...new Set(VACINAS.filter(v=>v.fase === "bebe").map(v=>v.mes))];

const marcoFeito = id => !!(state.marcos[id] || {}).feito;

/* ---------- amamentação e sono ---------- */
const mamadasDe = data => state.mamadas.filter(m=>m.data === data);
function resumoMamadas(data = isoHoje()){

/* ---------- hidratação ---------- */
/* 35 ml por quilo, mais o acréscimo da gestação ou da amamentação */
function metaAgua(){
  if(state.agua.meta > 0) return state.agua.meta;
  const peso = pesoAtual() || num(state.corpo.pesoPre) || 65;
  const extra = gestacao().nasceu ? 700 : 300;
  return Math.round((peso * 35 + extra) / 50) * 50;
}
const aguaDe = data => Number(state.agua.dias[data] || 0);

/* ---------- ciclo menstrual e fertilidade ---------- */
const ciclosOrdenados = () => state.ciclos.slice().sort((a,b)=>String(b.inicio).localeCompare(String(a.inicio)));
function duracaoMediaCiclo(){
  const ord = ciclosOrdenados();
  const gaps = [];
  for(let i = 0; i < ord.length - 1; i++){
    const d = diasEntre(ord[i+1].inicio, ord[i].inicio);
    if(d >= 15 && d <= 60) gaps.push(d);
  }
  if(!gaps.length) return Math.round(num(state.cicloCfg.duracao) || 28);
  return Math.round(gaps.slice(0,6).reduce((s,d)=>s + d, 0) / Math.min(6, gaps.length));
}
/* Janela fértil: da ovulação menos 5 dias até a ovulação mais 1 */
function janelaFertil(inicio, dur){
  const ovulacao = somaDias(inicio, dur - 14);
  return {ovulacao, de: somaDias(ovulacao, -5), ate: somaDias(ovulacao, 1),
          proxima: somaDias(inicio, dur), dpp: somaDias(ovulacao, 266)};
}

/* ---------- humor ---------- */
const humorDe = data => state.humor.find(h=>h.data === data) || null;
function mediaHumor(dias = 14){
  const limite = somaDias(isoHoje(), -dias);
  const lista = state.humor.filter(h=>h.data > limite);
  if(!lista.length) return null;
  return lista.reduce((s,h)=>s + h.nivel, 0) / lista.length;
}

/* ---------- backup ---------- */
function dadosBackup(){
  const dados = {app:"nosso-bebe", versao:2, exportado: new Date().toISOString()};
  SALVAR.forEach(k=>{ dados[k] = state[k]; });
  return dados;
}
/* O código de backup é o mesmo JSON em base64, para caber num campo de texto */
function codigoBackup(){
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify(dadosBackup())))); }
  catch(e){ return ""; }
}
function lerCodigo(txt){
  const bruto = String(txt || "").trim();
  if(!bruto) return null;
  try{
    const json = bruto.startsWith("{") ? bruto : decodeURIComponent(escape(atob(bruto.replace(/\s+/g, ""))));
    const obj = JSON.parse(json);
    return (obj && typeof obj === "object" && !Array.isArray(obj)) ? obj : null;
  }catch(e){ return null; }
}
function restaurar(obj){
  if(!obj || typeof obj !== "object") return false;
  const limpo = {};
  SALVAR.forEach(k=>{ if(obj[k] !== undefined) limpo[k] = obj[k]; });
  state = {...estadoInicial(), ...limpo};
  save(); load();
  return true;
}

function listaEnxoval(){
  const q = busca.trim().toLowerCase();
  const ids = ativos().concat(todosIds().filter(id=>isOculto(id)))
    .filter((id,i,a)=>a.indexOf(id) === i)
    .filter(id=>{
      const it = item(id);
      if(state.catAberta !== "Tudo" && it.cat !== state.catAberta) return false;
      if(isOculto(id)) return filtro === "ocultos";
      if(filtro === "ocultos") return false;
      if(q && !(it.nome.toLowerCase().includes(q) || it.loja.toLowerCase().includes(q) || it.cat.toLowerCase().includes(q))) return false;
      if(filtro === "falta" && falta(id) === 0) return false;
      if(filtro === "tenho" && tem(id) === 0) return false;
      if(filtro === "fav" && !isFav(id)) return false;
      return true;
    });
  const cabecalho = state.catAberta === "Tudo" ? "" : (()=>{
      const pc = progressoCat(state.catAberta);
      return `<div class="dupla" style="margin-top:22px">
        <div style="font-size:13px; color:var(--color-neutral-600)">${pc.itensOk} de ${pc.total} completos · ${BRL(faltantes({cat:state.catAberta}).reduce((s,f)=>s+f.custo,0))} a comprar</div>
        <div class="h1" style="font-size:15px">${pc.pct}%</div>
      </div>${barra(pc.pct, "fina")}`;
    })();
  if(!ids.length) return cabecalho + `<div class="vazio" style="margin-top:26px">
    Nada aqui com esses filtros. Toque em “Tudo” para ver o enxoval inteiro.</div>`;
  return cabecalho + `<div class="lista" style="gap:20px; margin-top:28px">
    ${ids.map(id=>{
      const it = item(id), m = meta(id), f = falta(id);
      const cor = isOculto(id) ? "var(--color-neutral-400)"
                : (m > 0 && f === 0 ? "var(--color-accent)" : "var(--color-text)");
      const selo = isOculto(id) ? "oculto" : (m === 0 ? "fora do perfil"
                 : f === 0 ? "ok" : PRIOS[it.prio][0].toLowerCase());
      return `<button class="item-linha" data-action="abrir-item" data-id="${id}">
        <span class="thumb">
          <img src="${URSO.item}" alt="">
          <span class="tam">${esc(it.tam === "—" ? "·" : it.tam)}</span>
        </span>
        <span style="flex:1">
          <span class="h1" style="display:block; font-size:18px; line-height:1.2">${esc(it.nome)}${isFav(id) ? " ♥" : ""}</span>
          <span style="display:block; font-size:13px; color:var(--color-neutral-600); margin-top:3px">${esc(it.loja)} · ${BRL(it.preco)}${
            state.presentes[id] ? ` · 🎁 ${esc(state.presentes[id])}` : ""}</span>
        </span>
        <span style="text-align:right">
          <span class="h1" style="display:block; font-size:17px; color:${cor}">${it.tem}/${m}</span>
          <span style="display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--color-neutral-500); margin-top:4px">${selo}</span>
        </span>
      </button>`;
    }).join("")}
  </div>`;
}

  <div class="chips">
    ${METODOS.map(([v,r])=>`<button class="tag ${c.metodo === v ? "tag-accent" : "tag-outline"}"

  ${dpp ? `
    <div class="grade" style="margin-top:26px">
      ${cartao("Você está em", dias >= 0 && dias <= 300 ? `${Math.floor(dias/7)}s ${dias%7}d` : "—",

/* ---------- IMC gestacional ---------- */
function telaImc(){
  const altura = num(state.corpo.altura), pesoPre = num(state.corpo.pesoPre);

  const atual = pesoAtual(), g = gestacao();

  const esperado = faixa ? ganhoEsperado(faixa, g.semana) : null;
  const imcAtual = imcDe(atual, altura);
  let situacao = null;
  if(ganho !== null && esperado){
    situacao = ganho < esperado[0] - 0.5 ? ["Abaixo do esperado","tag-neutral"]
             : ganho > esperado[1] + 0.5 ? ["Acima do esperado","tag-accent-2"]

  const pesos = state.pesos.slice().sort((a,b)=>String(b.data).localeCompare(String(a.data)));
  return `
  ${capa("IMC<br>gestacional","O IMC de antes da gravidez define o ganho de peso recomendado. Na gestação o IMC sozinho não classifica nada — o que importa é o ganho.")}
  <div style="display:flex; gap:12px; margin-top:22px">

    <div class="field" style="flex:1"><label>Peso antes da gravidez (kg)</label>
      <input class="input" inputmode="decimal" data-campo-direto="corpo.pesoPre" value="${esc(state.corpo.pesoPre)}" placeholder="62"></div>
  </div>

  ${faixa ? `
    <div class="grade" style="margin-top:24px">
      ${cartao("IMC pré-gestacional", imcPre.toFixed(1).replace(".",","), esc(faixa.nome))}
      ${cartao("Ganho recomendado", `${String(faixa.ganho[0]).replace(".",",")} a ${String(faixa.ganho[1]).replace(".",",")} kg`, "na gestação inteira")}
      ${atual !== null ? cartao("Peso de hoje", `${String(atual).replace(".",",")} kg`, imcAtual ? `IMC ${imcAtual.toFixed(1).replace(".",",")}` : "") : ""}
      ${ganho !== null ? cartao("Já ganhou", `${ganho >= 0 ? "+" : ""}${ganho.toFixed(1).replace(".",",")} kg`, `na ${g.semana}ª semana`) : ""}
    </div>
    ${situacao ? `<div style="margin-top:20px">
      <div class="dupla">
        ${kicker("Comparado ao esperado","kicker-n")}
        <span class="tag tag-static ${situacao[1]}">${situacao[0]}</span>
      </div>
      <div style="font-size:14px; color:var(--color-neutral-700); margin-top:6px">
        Na ${g.semana}ª semana, o esperado para a sua faixa é ter ganho entre
        ${esperado[0].toFixed(1).replace(".",",")} e ${esperado[1].toFixed(1).replace(".",",")} kg.</div>
    </div>` : ""}` : vazio("Preencha altura e peso de antes da gravidez para ver o seu ganho recomendado.")}

  <button class="btn btn-primary btn-block" data-action="novo-peso" style="margin-top:26px">+ Registrar peso de hoje</button>
  ${pesos.length ? `<div style="margin-top:30px">
    ${kicker("Histórico de peso","kicker-n")}
    <div class="lista" style="gap:14px; margin-top:12px">
      ${pesos.map((p,i)=>{

  <div style="height:24px"></div>`;
}

/* ---------- Calendário de vacinas ---------- */
function telaVacinas(){
  const total = VACINAS.length, feitas = VACINAS.filter(v=>vacinaFeita(v.id)).length;
  const idade = idadeBebeMeses();
  const linha = v=>{
    const reg = state.vacinas[v.id] || {}, ok = !!reg.feita;
    const prevista = dataVacina(v);
    const atrasada = !ok && prevista && diasEntre(isoHoje(), prevista) < 0;
    const cor = ok ? "var(--color-accent)" : (atrasada ? "var(--color-accent-2)" : "var(--color-text)");
    return `<button class="check" data-action="vacina" data-id="${v.id}">
      <span class="ico">${ic(ok ? "check-circle" : "circle", 20, cor)}</span>
      <span style="flex:1">
        <span style="display:block; font-size:16px; line-height:1.3; color:${cor}" class="${ok ? "riscado" : ""}">${esc(v.nome)}</span>
        <span class="mini" style="display:block; margin-top:2px">
          ${ok && reg.data ? `aplicada em ${dataBR(reg.data)}` : (prevista ? `prevista para ${dataBR(prevista)}${atrasada ? " · em atraso" : ""}` : esc(v.quando || ""))}</span>
        ${v.nota && !ok ? `<span class="mini" style="display:block; margin-top:3px; color:var(--color-neutral-600)">${esc(v.nota)}</span>` : ""}
      </span>
    </button>`;
  };
  return `
  ${capa("Calendário<br>de vacinas",`${feitas} de ${total} doses marcadas. Calendário do Programa Nacional de Imunizações.`)}
  ${barra(Math.round(feitas/total*100))}
  <div style="margin-top:22px">
    ${campoData("Data de nascimento do bebê","nascimento", state.nascimento)}
    <div class="mini" style="margin-top:6px">${idade !== null
      ? `O bebê tem ${idade} ${plural(idade,"mês","meses")}. As datas previstas aparecem em cada dose.`
      : "Preencha para o app calcular a data prevista de cada dose."}</div>
  </div>

  <div style="margin-top:30px">
    ${kicker("Na gestação","kicker-n")}
    <div class="lista" style="gap:16px; margin-top:14px">
      ${VACINAS.filter(v=>v.fase === "gestante").map(linha).join("")}
    </div>
  </div>

  ${IDADES_VACINA.map(mes=>`
    <div style="margin-top:28px">
      <div class="dupla">
        ${kicker(rotuloIdade(mes),"kicker-n")}
        ${idade !== null && idade >= mes ? `<span class="tag tag-static tag-neutral">já passou</span>` : ""}
      </div>
      <div class="lista" style="gap:16px; margin-top:14px">
        ${VACINAS.filter(v=>v.fase === "bebe" && v.mes === mes).map(linha).join("")}
      </div>
    </div>`).join("")}

  <div class="dica" style="margin-top:30px">${ic("syringe",20)}
    <p>Leve sempre a caderneta de vacinação. O calendário pode mudar de um ano para o outro e
    entre estados — confira na unidade de saúde.</p></div>
  <div style="height:24px"></div>`;
}

/* ---------- Desenvolvimento do bebê ---------- */
function telaMarcos(){
  const p = progressoMarcos(), idade = idadeBebeMeses();
  return `
  ${capa("Desenvolvimento<br>do bebê",`${p.ok} de ${p.total} marcos registrados. Cada bebê tem o seu ritmo — isto é um mapa, não uma prova.`)}
  ${barra(p.pct)}
  <div style="margin-top:22px">
    ${campoData("Data de nascimento do bebê","nascimento", state.nascimento)}
    ${idade !== null ? `<div class="mini" style="margin-top:6px">O bebê tem ${idade} ${plural(idade,"mês","meses")}.</div>` : ""}
  </div>
  ${IDADES_MARCO.map(mes=>{
    const pm = progressoMarcos(mes);
    const atual = idade !== null && idade >= mes - 1 && idade <= mes + 2;
    return `<div style="margin-top:30px">
      <div class="dupla">
        ${kicker(`${mes} ${plural(mes,"mês","meses")}`, atual ? "" : "kicker-n")}
        <span class="tag tag-static ${pm.pct === 100 ? "tag-accent" : "tag-neutral"}">${pm.ok}/${pm.total}</span>
      </div>
      <div class="lista" style="gap:16px; margin-top:14px">

          const cor = ok ? "var(--color-accent)" : "var(--color-text)";
          return `<button class="check" data-action="marco" data-id="${m.id}">
            <span class="ico">${ic(ok ? "check-circle" : "circle", 20, cor)}</span>
            <span style="flex:1">
              <span style="display:block; font-size:16px; line-height:1.3; color:${cor}">${esc(m.texto)}</span>

  <div style="height:24px"></div>`;

/* ---------- Calculadora de hidratação ---------- */
function telaAgua(){
  const meta = metaAgua(), hojeMl = aguaDe(isoHoje());
  const pct = Math.min(100, Math.round(hojeMl/meta*100));
  const ultimos = [...Array(7)].map((_,i)=>{
    const data = somaDias(isoHoje(), -6 + i);
    return {data, ml: aguaDe(data)};
  });
  const maxMl = Math.max(meta, ...ultimos.map(u=>u.ml));
  return `
  ${capa("Calculadora<br>de hidratação","35 ml por quilo mais o acréscimo da gestação. Beber bem reduz inchaço, cãibra e contração de treinamento.")}
  <div style="text-align:center; margin-top:28px">
    <div class="h1" style="font-size:56px; line-height:1">${(hojeMl/1000).toFixed(1).replace(".",",")} L</div>
    <div class="mini" style="margin-top:4px">de ${(meta/1000).toFixed(1).replace(".",",")} L hoje · ${pct}%</div>
  </div>
  ${barra(pct)}
  <div style="display:flex; gap:10px; margin-top:22px">
    ${COPOS.map(([ml,rot])=>`<button class="btn btn-primary" data-action="agua-add" data-v="${ml}" style="flex:1; padding:14px 8px">
      <span style="display:block; text-align:center; line-height:1.3">${rot}<br>
        <span style="font-size:11px; opacity:.85">${ml} ml</span></span></button>`).join("")}
  </div>
  <button class="btn btn-ghost btn-block" data-action="agua-add" data-v="-200" style="margin-top:8px">Tirar um copo</button>

  <div style="margin-top:30px">
    ${kicker("Sua meta","kicker-n")}
    <div class="field" style="margin-top:10px"><label>Meta do dia em ml (deixe vazio para calcular pelo peso)</label>
      <input class="input" inputmode="numeric" data-campo-direto="agua.meta" value="${state.agua.meta || ""}" placeholder="${meta}"></div>
    <div class="mini" style="margin-top:6px">${state.agua.meta > 0 ? "Meta definida por você."
      : `Calculada com ${String(pesoAtual() || num(state.corpo.pesoPre) || 65).replace(".",",")} kg${gestacao().nasceu ? " e o acréscimo da amamentação" : " e o acréscimo da gestação"}.`}</div>
  </div>

  <div style="margin-top:30px">
    ${kicker("Últimos 7 dias","kicker-n")}
    <div class="barras">
      ${ultimos.map(u=>`<span class="${u.ml >= meta ? "on" : ""}"
        style="height:${Math.max(2, Math.round(u.ml/maxMl*90))}px"></span>`).join("")}
    </div>
    <div style="display:flex; justify-content:space-between; margin-top:6px">
      ${ultimos.map(u=>`<span class="mini" style="flex:1; text-align:center">${u.data.slice(8)}</span>`).join("")}
    </div>
  </div>

  <div class="dica" style="margin-top:26px">${ic("drop",20)}
    <p>Em dias de calor, exercício ou febre, some mais meio litro. Urina bem clara é o melhor sinal
    de que a conta está fechando.</p></div>
  <div style="height:24px"></div>`;
}

/* ---------- Ciclo menstrual ---------- */
function telaCiclo(){
  const ord = ciclosOrdenados(), dur = duracaoMediaCiclo();
  const ultimo = ord[0];
  const prox = ultimo ? somaDias(ultimo.inicio, dur) : null;
  const diaDoCiclo = ultimo ? diasEntre(ultimo.inicio, isoHoje()) + 1 : null;
  return `
  ${capa("Ciclo<br>menstrual","Registre o primeiro dia de cada menstruação. Com dois ciclos o app já calcula a sua média.")}
  <button class="btn btn-primary btn-block" data-action="novo-ciclo" style="margin-top:24px">+ Registrar menstruação</button>

  ${ultimo ? `
    <div class="grade" style="margin-top:26px">
      ${cartao("Dia do ciclo", diaDoCiclo > 0 ? String(diaDoCiclo) : "—", `desde ${dataBR(ultimo.inicio)}`)}
      ${cartao("Ciclo médio", `${dur} dias`, ord.length > 1 ? `média de ${Math.min(6, ord.length - 1)} ciclos` : "estimativa")}
      ${cartao("Próxima prevista", dataBR(prox), diasEntre(isoHoje(), prox) >= 0 ? `em ${diasEntre(isoHoje(), prox)} dias` : "atrasada")}
      ${cartao("Janela fértil", `${dataBR(janelaFertil(ultimo.inicio, dur).de).slice(0,5)} a ${dataBR(janelaFertil(ultimo.inicio, dur).ate).slice(0,5)}`, "os dias de maior chance")}
    </div>

    <div style="margin-top:32px">
      ${kicker("Histórico","kicker-n")}
      <div class="lista" style="gap:14px; margin-top:12px">
        ${ord.map((c,i)=>{
          const ant = ord[i+1];
          const tam = ant ? diasEntre(ant.inicio, c.inicio) : null;
          const sang = c.fim ? diasEntre(c.inicio, c.fim) + 1 : null;
          return `<button class="tocavel" data-action="editar-ciclo" data-id="${esc(c.id)}">
            <div class="dupla">
              <div style="font-size:15px">${dataBR(c.inicio)}${c.fim ? ` a ${dataBR(c.fim)}` : ""}</div>
              <div class="mini">${sang ? `${sang} ${plural(sang,"dia")} de fluxo` : "sem fim marcado"}</div>
            </div>
            ${tam ? `<div class="mini">ciclo de ${tam} dias</div>` : ""}
          </button>`;
        }).join("")}
      </div>
    </div>` : vazio("Nenhum ciclo registrado ainda.")}
  <div style="height:24px"></div>`;
}

/* ---------- Calculadora de fertilidade ---------- */
function telaFertil(){
  const ord = ciclosOrdenados();
  const base = dataValida(state.cicloCfg.base) ? state.cicloCfg.base : (ord[0] ? ord[0].inicio : "");
  const dur = Math.max(20, Math.min(45, Math.round(num(state.cicloCfg.duracao) || duracaoMediaCiclo())));
  const j = base ? janelaFertil(base, dur) : null;
  return `
  ${capa("Calculadora<br>de fertilidade","A ovulação acontece cerca de 14 dias antes da próxima menstruação. Os dias férteis são os cinco anteriores mais o dia seguinte.")}
  <div style="margin-top:22px">
    ${campoData("Primeiro dia da última menstruação","cicloCfg.base", base)}
    <div class="field" style="margin-top:14px"><label>Duração do seu ciclo (dias)</label>
      <input class="input" inputmode="numeric" data-campo-direto="cicloCfg.duracao" value="${esc(state.cicloCfg.duracao)}" placeholder="${duracaoMediaCiclo()}"></div>
  </div>

  ${j ? `
    <div class="grade" style="margin-top:26px">
      ${cartao("Ovulação", dataBR(j.ovulacao), `dia ${dur - 14} do ciclo`)}
      ${cartao("Janela fértil", `${dataBR(j.de).slice(0,5)} a ${dataBR(j.ate).slice(0,5)}`, "6 dias de maior chance")}
      ${cartao("Próxima menstruação", dataBR(j.proxima), `ciclo de ${dur} dias`)}
      ${cartao("Se engravidar agora", dataCurta(j.dpp), "data prevista do parto")}
    </div>

    <div style="margin-top:32px">
      ${kicker("Próximos ciclos","kicker-n")}
      <div class="lista" style="gap:18px; margin-top:14px">
        ${[0,1,2].map(k=>{
          const ini = somaDias(base, dur*k), jk = janelaFertil(ini, dur);
          const agora = diasEntre(isoHoje(), jk.ate) >= 0 && diasEntre(jk.de, isoHoje()) >= 0;
          return `<div>
            <div class="dupla">
              <div class="h1" style="font-size:16px; color:${agora ? "var(--color-accent)" : "var(--color-text)"}">
                ${dataBR(jk.de)} a ${dataBR(jk.ate)}</div>
              ${agora ? `<span class="tag tag-static tag-accent">agora</span>` : ""}
            </div>
            <div class="mini">ovulação em ${dataBR(jk.ovulacao)} · menstruação em ${dataBR(jk.proxima)}</div>
          </div>`;
        }).join("")}
      </div>
    </div>

    <div class="dica" style="margin-top:26px">${ic("lightbulb",20)}
      <p>A conta vale para ciclos regulares e é uma estimativa: muco cervical elástico, aumento da
      libido e teste de ovulação dizem mais que o calendário. Não serve como método contraceptivo.</p></div>`
  : vazio("Preencha a data da última menstruação para ver a sua janela fértil.")}
  <div style="height:24px"></div>`;
}

/* ---------- Rastreador de humor ---------- */
function telaHumor(){
  const dHoje = humorDe(isoHoje()), media = mediaHumor();
  const ultimos = [...Array(14)].map((_,i)=>{
    const data = somaDias(isoHoje(), -13 + i);
    return {data, h: humorDe(data)};
  });
  const lista = state.humor.slice().sort((a,b)=>String(b.data).localeCompare(String(a.data))).slice(0,20);
  const baixos = state.humor.filter(h=>h.data > somaDias(isoHoje(), -14) && h.nivel <= 2).length;
  return `
  ${capa("Rastreador<br>de humor","Como você está hoje? Registrar todo dia mostra o padrão — e o padrão é o que importa.")}
  <div class="chips" style="margin-top:22px">
    ${HUMORES.map(h=>`<button class="tag ${dHoje && dHoje.nivel === h.n ? "tag-accent" : "tag-outline"}"
      data-action="humor-nivel" data-v="${h.n}">${h.n} · ${h.nome}</button>`).join("")}
  </div>

  ${dHoje ? `
    <div style="margin-top:24px">
      ${kicker("O que pesa hoje","kicker-n")}
      <div class="chips" style="margin-top:10px">
        ${HUMOR_TAGS.map(t=>`<button class="tag ${dHoje.tags.includes(t) ? "tag-accent" : "tag-outline"}"
          data-action="humor-tag" data-v="${esc(t)}">${esc(t)}</button>`).join("")}
      </div>
      <div class="field" style="margin-top:18px"><label>Anotação do dia</label>
        <input class="input" data-campo-direto="humor.nota" value="${esc(dHoje.nota)}" placeholder="o que aconteceu hoje"></div>
    </div>` : ""}

  ${media !== null ? `<div class="grade" style="margin-top:26px">
    ${cartao("Média de 14 dias", media.toFixed(1).replace(".",","), "de 1 a 5")}
    ${cartao("Dias registrados", String(ultimos.filter(u=>u.h).length), "nas últimas 2 semanas")}
  </div>` : ""}

  <div style="margin-top:30px">
    ${kicker("Últimas 2 semanas","kicker-n")}
    <div class="barras">
      ${ultimos.map(u=>`<span class="${u.data === isoHoje() ? "on" : ""}"
        style="height:${u.h ? Math.round(u.h.nivel/5*90) : 2}px"></span>`).join("")}
    </div>
  </div>

  ${baixos >= 5 ? `<div class="dica" style="margin-top:24px">${ic("users-two",20)}
    <p>Foram ${baixos} dias difíceis nas últimas duas semanas. Tristeza persistente na gravidez e no
    pós-parto é comum e tem tratamento — vale falar com a sua equipe ou ligar para o CVV, 188,
    que atende 24 horas.</p></div>` : ""}

  ${lista.length ? `<div style="margin-top:30px">
    ${kicker("Registro","kicker-n")}
    <div class="lista" style="gap:16px; margin-top:12px">
      ${lista.map(h=>`<div>
        <div class="dupla">
          <div style="font-size:15px">${dataBR(h.data)}</div>
          <span class="tag tag-static ${h.nivel <= 2 ? "tag-accent-2" : "tag-neutral"}">${(HUMORES.find(x=>x.n === h.nivel) || {}).nome || h.nivel}</span>
        </div>
        ${h.tags.length ? `<div class="mini" style="margin-top:2px">${esc(h.tags.join(" · "))}</div>` : ""}
        ${h.nota ? `<div class="mini" style="margin-top:2px; color:var(--color-neutral-700)">${esc(h.nota)}</div>` : ""}
      </div>`).join("")}
    </div></div>` : ""}
  <div style="height:24px"></div>`;
}

    confirmação antes.</p></div>

}
function render(){

/* ==================================================================
   CAMADA 5 — ACTIONS (um mapa + delegação de eventos)
   ================================================================== */
function abrirForm(tipo, base){ formTipo = tipo; form = base || {}; render(); }
function fecharForm(){ formTipo = null; form = {}; render(); }
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isNaN(n) ? null : n; };
function ajusteDe(id){ return (state.itens[id] = state.itens[id] || {}); }

function salvarItem(){
  const nome = String(form.nome || "").trim();
  if(!nome) return fecharForm();
  const dados = {
    nome, cat: form.cat || CATS[0],
    tam:  String(form.tam  || "").trim() || "—",
    loja: String(form.loja || "").trim() || "a definir",
    preco: Math.max(0, num(form.preco) ?? 0),
    meta:  Math.max(1, Math.round(num(form.qtd) ?? 1)),
    prio:  Number(form.prio) || 1,
  };
  const temQtd = Math.max(0, Math.round(num(form.tem) ?? 0));
  if(form.id && CAT_MAP[form.id]){                     /* item do catálogo: guarda os ajustes */
    const a = ajusteDe(form.id);
    a.tem = temQtd; a.preco = dados.preco; a.tam = dados.tam; a.loja = dados.loja;
    a.nome = dados.nome; a.cat = dados.cat; a.prio = dados.prio;
    /* a quantidade só vira fixa se você pedir outra que não a recomendada pelo perfil */
    delete a.meta;
    if(dados.meta !== meta(form.id)) a.meta = dados.meta;
  } else if(form.id){                                  /* item criado por você */
    state.extras = state.extras.map(e=>e.id === form.id ? {...e, ...dados} : e);
    ajusteDe(form.id).tem = temQtd;
  } else {
    const id = "x" + Date.now().toString(36);
    state.extras = [...state.extras, {id, ...dados}];
    ajusteDe(id).tem = temQtd;
    state.catAberta = dados.cat;
  }
  save(); fecharForm();
}
function salvarConsulta(){
  const titulo = String(form.titulo || "").trim();
  if(!titulo) return fecharForm();
  const nova = {dia: String(form.dia || "").trim().padStart(2,"0") || "01",
    mes: String(form.mes || "").trim().toLowerCase() || MESES[hoje().getMonth()],
    titulo, desc: String(form.desc || "").trim()};
  state.agenda = form.idx === undefined ? [...state.agenda, nova]
    : state.agenda.map((a,k)=> k === Number(form.idx) ? nova : a);
  save(); fecharForm();
}

/* as opções do tema do parto viram campos op0, op1… no formulário */
function opsDoForm(){
  return (Array.isArray(form.ops) ? form.ops : []).map((o,i)=> form["op" + i] !== undefined ? form["op" + i] : o);
}
function limparOps(){ Object.keys(form).forEach(k=>{ if(/^op\d+$/.test(k)) delete form[k]; }); }

function salvarNome(){
  const nome = String(form.nome || "").trim();
  if(!nome) return fecharForm();
  const dados = {nome, significado: String(form.significado || "").trim(),
    nota: String(form.nota || "").trim()};
  if(form.id){
    state.nomesLista = state.nomesLista.map(n=>n.id === form.id ? {...n, ...dados} : n);
  } else {
    state.nomesLista = [...state.nomesLista, {id: novoId("n"), ...dados}];
  }
  save(); fecharForm();
}
function salvarParto(){
  const tema = String(form.tema || "").trim();
  if(!tema) return fecharForm();
  const opcoes = [...new Set(opsDoForm().map(o=>String(o).trim()).filter(Boolean))];
  const nota = String(form.nota || "").trim();
  if(form.id){
    state.partoLista = state.partoLista.map(p=>p.id === form.id
      ? {...p, tema, opcoes, nota, escolha: opcoes.includes(p.escolha) ? p.escolha : ""} : p);
  } else {
    state.partoLista = [...state.partoLista, {id: novoId("p"), tema, opcoes, escolha:"", nota}];
  }
  save(); fecharForm();
}

const ACTIONS = {
  "ir":(d)=>ir(d.tela),
  "ir-cat":(d)=>{ state.catAberta = d.cat; filtro = "todos"; busca = ""; ir("enxoval"); },
  "cat":(d)=>{ state.catAberta = d.cat; save(); render(); },
  "filtro":(d)=>{ filtro = d.f; render(); },
  "prio":(d)=>{ prioCompras = Number(d.v); render(); },
  "kit-tipo":(d)=>{ kitTipo = d.v; render(); },
  "kit-passos":(d)=>abrirForm("passos", {id:d.id}),

  /* --- item --- */
  "abrir-item":(d)=>{
    if(!existe(d.id)) return;
    state.itemAberto = d.id; formTipo = null;
    render(); document.getElementById("tela").scrollTop = 0;
  },
  "ajustar":(d)=>{
    const id = state.itemAberto, a = ajusteDe(id);
    a.tem = Math.max(0, tem(id) + Number(d.d));
    save(); render();
  },
  "fav":(d)=>{
    state.favoritos = state.favoritos.includes(d.id)
      ? state.favoritos.filter(x=>x !== d.id) : [...state.favoritos, d.id];
    save(); render();
  },
  "ocultar":(d)=>{
    const a = ajusteDe(d.id);
    a.oculto = !a.oculto;
    if(a.oculto) state.itemAberto = null;
    save(); render();
  },
  "novo-item":()=>abrirForm("item", {cat: state.catAberta === "Tudo" ? CATS[0] : state.catAberta, qtd:"1", tem:"0", prio:"1"}),
  "editar-item":()=>{
    const id = state.itemAberto, it = item(id);
    if(!it) return;
    abrirForm("item", {id, nome:it.nome, cat:it.cat, tam:it.tam, loja:it.loja,
      preco:String(it.preco), qtd:String(meta(id)), tem:String(it.tem), prio:String(it.prio)});
  },
  "apagar-item":()=>{
    const id = state.itemAberto;
    state.extras = state.extras.filter(e=>e.id !== id);
    delete state.itens[id];
    state.favoritos = state.favoritos.filter(x=>x !== id);
    state.itemAberto = null;
    save(); ir("enxoval");
  },
  "form-cat":(d)=>{ form.cat = d.v; renderOverlay(); },
  "form-prio":(d)=>{ form.prio = d.v; renderOverlay(); },
  "salvar-item":()=>salvarItem(),
  "fechar-form":()=>fecharForm(),

  /* --- compras e histórico --- */
  "comprei":(d)=>{
    const f = falta(d.id) || 1;
    abrirForm("compra", {id:d.id, qtd:String(f), valor:String(f * precoDe(d.id))});
  },
  "confirmar-compra":()=>{
    const id = form.id, qtd = Math.max(1, Math.round(num(form.qtd) ?? 1));
    const valor = Math.max(0, num(form.valor) ?? 0);
    ajusteDe(id).tem = tem(id) + qtd;
    state.historico = [...state.historico, {data: new Date().toISOString().slice(0,10), ts:Date.now(), id, qtd, valor}];
    delete state.presentes[id];
    save(); fecharForm();
  },
  "apagar-hist":(d)=>{
    const ordenado = state.historico.slice().sort((a,b)=> String(b.data).localeCompare(String(a.data)) || (b.ts||0) - (a.ts||0));
    const alvo = ordenado[Number(d.i)];
    if(!alvo) return;
    state.historico = state.historico.filter(x=>x !== alvo);
    save(); render();
  },

  /* --- chá de bebê --- */
  "reservar":(d)=>abrirForm("presente", {id:d.id}),
  "salvar-presente":()=>{
    state.presentes[form.id] = String(form.quem || "").trim() || "reservado";
    save(); fecharForm();
  },
  "liberar":(d)=>{ delete state.presentes[d.id]; save(); render(); },

  /* --- mala --- */
  "mala":(d)=>{
    if(state.malaCheck[d.id]) delete state.malaCheck[d.id]; else state.malaCheck[d.id] = true;
    save(); render();
  },
  "add-mala":()=>{
    const el = document.getElementById("inMala"), v = (el ? el.value : "").trim();
    if(!v) return;
    if(!state.bolsaExtras.includes(v)) state.bolsaExtras = [...state.bolsaExtras, v];
    save(); render();
  },

  /* --- saúde --- */
  "nova-consulta":()=>abrirForm("consulta", {mes: MESES[hoje().getMonth()]}),
  "editar-consulta":(d)=>{
    const a = state.agenda[Number(d.i)];
    if(!a) return;
    abrirForm("consulta", {idx:Number(d.i), dia:a.dia, mes:a.mes, titulo:a.titulo, desc:a.desc});
  },
  "salvar-consulta":()=>salvarConsulta(),
  "apagar-consulta":()=>{
    const idx = Number(form.idx);
    state.agenda = state.agenda.filter((a,k)=>k !== idx);
    state.feitos = state.feitos.filter(k=>k !== idx).map(k=>k > idx ? k - 1 : k);
    save(); fecharForm();
  },
  "feito":(d)=>{
    const k = Number(d.i);
    state.feitos = state.feitos.includes(k) ? state.feitos.filter(x=>x !== k) : [...state.feitos, k];
    save(); render();
  },

  /* --- nomes e parto --- */
  "fav-nome":(d)=>{
    state.nomes = state.nomes.includes(d.id) ? state.nomes.filter(x=>x !== d.id) : [...state.nomes, d.id];
    save(); render();
  },
  "novo-nome":()=>abrirForm("nome"),
  "editar-nome":(d)=>{
    const n = state.nomesLista.find(x=>x.id === d.id);
    if(!n) return;
    abrirForm("nome", {id:n.id, nome:n.nome, significado:n.significado, nota:n.nota});
  },
  "salvar-nome":()=>salvarNome(),
  "apagar-nome":()=>{
    state.nomesLista = state.nomesLista.filter(n=>n.id !== form.id);
    state.nomes = state.nomes.filter(x=>x !== form.id);
    save(); fecharForm();
  },
  "parto":(d)=>{
    state.partoLista = state.partoLista.map(p=>p.id === d.id
      ? {...p, escolha: p.escolha === d.opcao ? "" : d.opcao} : p);   /* tocar de novo desmarca */
    save(); render();
  },
  "novo-parto":()=>abrirForm("parto", {ops:[""]}),
  "editar-parto":(d)=>{
    const p = state.partoLista.find(x=>x.id === d.id);
    if(!p) return;
    abrirForm("parto", {id:p.id, tema:p.tema, ops:p.opcoes.slice(), nota:p.nota});
  },
  "form-op-add":()=>{ form.ops = [...opsDoForm(), ""]; limparOps(); renderOverlay(); },
  "form-op-del":(d)=>{ form.ops = opsDoForm().filter((o,i)=>i !== Number(d.i)); limparOps(); renderOverlay(); },
  "salvar-parto":()=>salvarParto(),
  "apagar-parto":()=>{
    state.partoLista = state.partoLista.filter(p=>p.id !== form.id);
    save(); fecharForm();
  },


  /* --- calculadora gestacional --- */
  "calc-metodo":(d)=>{ state.calc.metodo = d.v; save(); render(); },
  "calc-usar":()=>{
    const dpp = dppCalculada();
    if(dpp){ state.dpp = dpp; save(); render(); }
  },

  /* --- contador de chutes --- */
  "chute-comecar":()=>{ state.chuteAtivo = {ini:Date.now(), marcas:[]}; save(); render(); },
  "chute-marcar":()=>{
    const s = state.chuteAtivo;
    if(!s) return;
    s.marcas = [...s.marcas, Date.now()];
    if(s.marcas.length >= CHUTES_META){ ACTIONS["chute-encerrar"](); return; }
    save(); render();
  },
  "chute-encerrar":()=>{
    const s = state.chuteAtivo;
    if(!s) return;

document.addEventListener("click",(e)=>{
  const el = e.target.closest("[data-action]");

  if(fn){ e.preventDefault(); fn(el.dataset); }
});
/* Campos que escrevem direto no estado — inclusive caminhos como "calc.dum" */
function setDireto(k, v){
  if(k === "meta"){ const n = num(v); if(n > 0) state.meta = n; return; }
  if(k === "dpp"){ if(v) state.dpp = v; return; }
  if(k === "nascimento"){ state.nascimento = dataValida(v) ? v : ""; return; }
  if(k === "humor.nota"){ const h = humorDe(isoHoje()); if(h) h.nota = v; return; }
  if(k === "agua.meta"){ const n = num(v); state.agua.meta = n > 0 ? Math.round(n) : 0; return; }
  const [a, b] = k.split(".");
  if(b && state[a] && typeof state[a] === "object") state[a][b] = v;
}
document.addEventListener("input",(e)=>{
  const t = e.target;
  if(t.dataset && t.dataset.campo){ form[t.dataset.campo] = t.value; return; }   /* sem re-render ao digitar */
  if(t.dataset && t.dataset.campoDireto){ setDireto(t.dataset.campoDireto, t.value); save(); return; }
  if(t.id === "busca"){ busca = t.value; patchEnxoval(); return; }
});
document.addEventListener("change",(e)=>{
  const t = e.target;
  if(t.id === "inArquivo" && t.files && t.files[0]){          /* restaurar de um arquivo */
    const leitor = new FileReader();
    leitor.onload = ()=>{
      const obj = lerCodigo(String(leitor.result));
      if(obj) abrirForm("restaurar", {dados:obj});
      else alert("Este arquivo não parece um backup do app.");
    };
    leitor.readAsText(t.files[0]);
    t.value = "";
    return;
  }
  /* o re-render só acontece no change: digitar não pode tirar o foco do campo */
  if(t.dataset && t.dataset.campoDireto){ setDireto(t.dataset.campoDireto, t.value); save(); render(); }
});
document.addEventListener("keydown",(e)=>{
  if(e.key === "Escape" && formTipo) fecharForm();
  if(e.key === "Enter"){
    if(e.target.id === "inMala"){ e.preventDefault(); ACTIONS["add-mala"](); }
    if(formTipo === "parto" && e.target.dataset && /^op\d+$/.test(e.target.dataset.campo || "")){
      e.preventDefault(); ACTIONS["form-op-add"]();
      const campos = document.querySelectorAll("#overlay [data-campo^='op']");
      if(campos.length) campos[campos.length - 1].focus();
      return;
    }
    if(formTipo && e.target.dataset && e.target.dataset.campo){
      const primario = document.querySelector("#overlay .btn-primary[data-action]");
      if(primario){ e.preventDefault(); primario.click(); }
    }
  }
});


/* ---------- cronômetros e respiração guiada ---------- */
let respira = {id:null, fase:0, resta:0, ciclo:0, ativo:false};
const horaAgora = () => new Date().toTimeString().slice(0,5);
function tsDe(data, hora){
  const d = dataValida(data) ? data : isoHoje();
  const h = /^\d{1,2}:\d{2}/.test(String(hora || "")) ? String(hora).slice(0,5) : "12:00";
  return new Date(`${d}T${h.padStart(5,"0")}:00`).getTime();
}
function pintarRespira(){
  const ex = RESPIRA_MAP[respira.id];
  if(!ex) return;
  const f = ex.fases[respira.fase] || ex.fases[0];
  const bolha = document.getElementById("respBolha");
  if(bolha){ bolha.style.transitionDuration = f[1] + "s"; bolha.style.transform = `scale(${f[2]})`; }
  const conta = document.getElementById("respConta");
  if(conta) conta.textContent = respira.resta;
  const fase = document.getElementById("respFase");
  if(fase) fase.textContent = f[0];
  const ciclo = document.getElementById("respCiclo");
  if(ciclo) ciclo.textContent = `ciclo ${respira.ciclo + 1} de ${ex.ciclos}`;
}
function tiqueRespira(){
  const ex = RESPIRA_MAP[respira.id];
  if(!ex){ respira.ativo = false; return; }
  respira.resta--;
  if(respira.resta > 0){
    const conta = document.getElementById("respConta");
    if(conta) conta.textContent = respira.resta;
    return;
  }
  respira.fase++;
  if(respira.fase >= ex.fases.length){ respira.fase = 0; respira.ciclo++; }
  if(respira.ciclo >= ex.ciclos){                      /* prática concluída */
    state.respiros[ex.id] = (state.respiros[ex.id] || 0) + 1;
    respira.ativo = false; respira.resta = 0;
    save(); render();
    return;
  }
  respira.resta = ex.fases[respira.fase][1];
  pintarRespira();
}
/* Um tique por segundo alimenta todo cronômetro na tela e a respiração guiada */
setInterval(()=>{
  document.querySelectorAll("[data-cronometro]").forEach(el=>{
    el.textContent = duracao(Date.now() - Number(el.dataset.cronometro));
  });
  if(respira.ativo) tiqueRespira();
}, 1000);

/* ==================================================================
   CAMADA 6 — INIT
   ================================================================== */
function init(){
  load();
  save();
  render();

  /* dev check: nenhuma referência cruzada pode apontar para um id inexistente */
  const bad = [];
  KITS.forEach(k=>[...(k.req||[]), ...(k.opt||[])].forEach(id=>{ if(!CAT_MAP[id]) bad.push(k.id + " → " + id); }));
  MALA.forEach(s=>s.ids.forEach(id=>{ if(!CAT_MAP[id]) bad.push("mala → " + id); }));
  FASES.forEach(f=>f.cats.forEach(c=>{ if(!CATS.includes(c)) bad.push(f.id + " → " + c); }));
  CATALOGO.forEach(i=>{ if(!CATS.includes(i.cat)) bad.push(i.id + " → categoria " + i.cat); });
  Object.keys(TELAS).forEach(t=>{ if(typeof TELAS[t] !== "function") bad.push("tela → " + t); });
  Object.keys(FORMS).forEach(f=>{ if(typeof FORMS[f] !== "function") bad.push("form → " + f); });
  if(bad.length) console.warn("Referências inexistentes:", bad);
}
init();

/* Service worker: guarda o app para funcionar sem internet.
   O preço disso é o cache ficar servindo a versão antiga. Para a atualização
   chegar sozinha: sw.js é sempre buscado na rede (updateViaCache "none"), o
   worker novo assume na hora (skipWaiting no sw.js) e a página recarrega uma
   única vez quando o controle troca. Na primeira instalação não recarrega,
   porque aí não existe versão velha na tela. */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  const jaControlada = !!navigator.serviceWorker.controller;
  let recarregando = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(recarregando || !jaControlada) return;
    recarregando = true;
    location.reload();
  });
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(reg=>{
      reg.update().catch(()=>{});                        /* procura versão nova ao abrir */
      setInterval(()=>reg.update().catch(()=>{}), 3600000);
      document.addEventListener("visibilitychange", ()=>{
        if(!document.hidden) reg.update().catch(()=>{});  /* e ao voltar para o app */
      });
    }).catch(()=>{});
  });
}
