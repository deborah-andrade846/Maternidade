:root{
  --color-bg:#f3f2f2;
  --color-surface:#eae9e9;
  --color-text:#201e1d;
  --color-accent:#0088b0;
  --color-accent-2:#d6006c;
  --color-divider:color-mix(in srgb,#201e1d 16%,transparent);

  --color-neutral-100:#f8f4f4; --color-neutral-200:#eae7e7; --color-neutral-300:#d7d3d3;
  --color-neutral-400:#bab6b6; --color-neutral-500:#9b9797; --color-neutral-600:#7d7979;
  --color-neutral-700:#605d5d; --color-neutral-800:#444141; --color-neutral-900:#2d2b2b;

  --color-accent-100:#e9f8ff; --color-accent-200:#cbeeff; --color-accent-300:#99e0ff;
  --color-accent-400:#62c5ee; --color-accent-500:#38a6cf; --color-accent-600:#1186ac;
  --color-accent-700:#006786; --color-accent-800:#004961; --color-accent-900:#0a303e;

  --color-accent-2-100:#fff1f4; --color-accent-2-200:#ffdee6; --color-accent-2-300:#ffc0d0;
  --color-accent-2-400:#ff90b1; --color-accent-2-500:#ff458e; --color-accent-2-600:#d82071;
  --color-accent-2-700:#aa0b56; --color-accent-2-800:#790e3d; --color-accent-2-900:#4b1528;

  --font-heading:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-heading-weight:600;
  --font-body:"Source Serif 4",Georgia,"Times New Roman",serif;

  --space-1:5px; --space-2:10px; --space-3:15px; --space-4:20px; --space-6:30px; --space-8:40px;
  --radius-sm:1px; --radius-md:2px; --radius-lg:4px;

  --shadow-sm:0 1px 2px color-mix(in srgb,#2d2b2b 14%,transparent);
  --shadow-md:0 3px 10px color-mix(in srgb,#2d2b2b 16%,transparent);
  --shadow-lg:0 12px 32px color-mix(in srgb,#2d2b2b 22%,transparent);
}

/* — base — */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#e6e4e2;color:var(--color-text);font-family:var(--font-body);
  font-size:15px;line-height:1.55;font-weight:400;-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;align-items:flex-start;padding:32px 0;
  overflow-wrap:anywhere}
button,input{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}
img{display:block;max-width:100%}
::selection{background:color-mix(in srgb,var(--color-accent) 30%,transparent)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
::-webkit-scrollbar{width:0;height:0}

/* — componentes do design system — */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:13px;
  line-height:1.2;color:var(--color-text);background:transparent;border:1px solid transparent;
  padding:calc(var(--space-2)*.85) var(--space-3);border-radius:var(--radius-md)}
.btn-primary{background:var(--color-accent);color:var(--color-bg)}
.btn-primary:hover{background:var(--color-accent-600)}
.btn-primary:active{background:var(--color-accent-700)}
.btn-secondary{border-color:var(--color-divider)}
.btn-secondary:hover{background:color-mix(in srgb,var(--color-text) 7%,transparent)}
.btn-secondary:active{background:color-mix(in srgb,var(--color-text) 14%,transparent)}
.btn-ghost{color:var(--color-accent);padding-inline:var(--space-1)}
.btn-ghost:hover{background:color-mix(in srgb,var(--color-accent) 10%,transparent)}
.btn-icon{width:34px;height:34px;padding:0}
.btn-block{width:100%;margin-top:var(--space-2)}
.field>label{display:block;font-size:12px;margin-bottom:5px;
  color:color-mix(in srgb,var(--color-text) 70%,transparent)}
.input{width:100%;min-height:36px;padding:6px 10px;font:inherit;font-size:14px;
  color:var(--color-text);caret-color:var(--color-accent);background:var(--color-surface);
  border:1px solid var(--color-divider);border-radius:var(--radius-md)}
.input:hover{border-color:color-mix(in srgb,var(--color-text) 45%,transparent)}
.input:focus-visible{border-color:var(--color-accent);outline-offset:0}
.tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.02em;
  padding:3px 10px;border-radius:calc(var(--radius-md)*.75);cursor:pointer;white-space:nowrap}
.tag-accent{background:var(--color-accent-100);color:var(--color-accent-800)}
.tag-outline{border:1px solid var(--color-accent);color:var(--color-accent)}

/* — moldura do app — */
.phone{width:390px;height:844px;background:var(--color-bg);position:relative;overflow:hidden;
  box-shadow:var(--shadow-lg);border-radius:var(--radius-md);flex:none}
.top{position:absolute;top:0;left:0;right:0;height:66px;display:flex;align-items:center;
  gap:10px;padding:0 22px;background:var(--color-bg);z-index:3}
.top-mark{width:40px;height:40px;object-fit:contain;object-position:top;margin-bottom:-4px}
.top-nome{font-family:var(--font-heading);font-weight:var(--font-heading-weight);
  font-size:19px;line-height:1;letter-spacing:-.01em}
.top-dpp{font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--color-neutral-500);margin-top:3px}
.top-sem{font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:12px;
  color:var(--color-accent-700);letter-spacing:.04em;background:none;padding:0}
.scroll{position:absolute;inset:0;top:66px;bottom:76px;overflow-y:auto;padding:14px 22px 24px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:76px;background:var(--color-bg);
  display:flex;align-items:flex-start;justify-content:space-around;padding-top:14px;
  border-top:1px solid var(--color-neutral-200);z-index:4}
.tab{text-align:center;width:66px;color:var(--color-neutral-500);background:none;padding:0}
.tab.on{color:var(--color-accent)}
.tab .lbl{font-size:10px;letter-spacing:.06em;margin-top:6px}
.overlay{position:absolute;inset:0;background:var(--color-bg);padding:44px 22px 24px;
  overflow-y:auto;z-index:5}

/* — tipografia da tela — */
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-accent-700)}
.kicker-2{color:var(--color-accent-2)}
.kicker-n{color:var(--color-neutral-500)}
.h-hero{font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:36px;
  line-height:1.03;margin-top:10px;letter-spacing:-.01em}
.h-tela{font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:34px;
  line-height:1.05;margin-top:8px}
.h1{font-family:var(--font-heading);font-weight:var(--font-heading-weight)}
.muted{color:var(--color-neutral-600)}
.voltar{font-size:13px;color:var(--color-accent-700);background:none;padding:0;text-align:left}
.linha{margin-top:22px;height:3px;background:var(--color-neutral-200);position:relative}
.linha>i{display:block;height:3px;background:var(--color-accent)}
.linha.mag>i{background:var(--color-accent-2)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.lista{display:grid}
.ic{width:1em;height:1em;fill:currentColor;display:block}
.tocavel{cursor:pointer;background:none;padding:0;text-align:left;width:100%;display:block}
.tocavel:hover{opacity:.65}

/* — enxoval — */
.item-linha{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;
  background:none;padding:0;cursor:pointer}
.item-linha:hover{opacity:.65}
.thumb{width:52px;height:52px;flex:0 0 52px;background:var(--color-neutral-200);
  border-radius:var(--radius-sm);position:relative;overflow:hidden}
.thumb img{position:absolute;left:50%;top:4px;transform:translateX(-50%);width:44px;opacity:.18}
.thumb .tam{position:absolute;left:0;right:0;bottom:0;background:var(--color-bg);text-align:center;
  font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:11px;
  letter-spacing:.06em;color:var(--color-neutral-700);padding:1px 0}
.foto{width:100%;height:190px;background:var(--color-neutral-200);border-radius:var(--radius-sm);
  margin-top:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;overflow:hidden}
.foto img{width:112px;object-fit:contain;opacity:.5}

/* — mais — */
.menu-num{width:54px;flex:0 0 54px;position:relative;height:54px}
.menu-num .quadro{position:absolute;inset:0;background:var(--color-neutral-200);border-radius:var(--radius-sm)}
.menu-num .num{position:absolute;left:-3px;top:-3px;font-family:var(--font-heading);
  font-weight:var(--font-heading-weight);font-size:11px;letter-spacing:.1em;color:var(--color-neutral-500)}
.menu-num .ic{position:absolute;left:15px;top:15px;font-size:26px;color:var(--color-accent-700)}

/* — celular de verdade: a moldura vira a tela inteira — */
@media (max-width:460px),(max-height:900px){
  body{padding:0;align-items:stretch}
  .phone{width:100%;height:100dvh;max-width:520px;box-shadow:none;border-radius:0}
}

/* ==================================================================

   ================================================================== */
const CHAVE = "app-gravidez-v1";
const DIAS_PADRAO = 245;                       /* 35 semanas: começa na semana 5 */
const hoje = () => new Date(new Date().toDateString());
function dppPadrao(){
  const d = hoje(); d.setDate(d.getDate() + DIAS_PADRAO);
  return d.toISOString().slice(0,10);
}

let state = {
  tela:"home",
  enxoval: ENXOVAL.map(c=>({...c, itens: c.itens.map(i=>({...i}))})),

  meta:9000,
  dpp:"",
};

/* estado de interface — não persiste */
let formTipo = null, form = {}, novaBolsa = "", novoNome = "";

function load(){
  try{ const s = JSON.parse(localStorage.getItem(CHAVE) || "null"); if(s) state = {...state, ...s}; }catch(e){}
  /* migração: garante os campos que versões antigas não tinham */
  if(!Array.isArray(state.enxoval) || !state.enxoval.length) state.enxoval = ENXOVAL.map(c=>({...c, itens:c.itens.map(i=>({...i}))}));
  if(!Array.isArray(state.agenda))     state.agenda = AGENDA.map(a=>({...a}));
  if(!Array.isArray(state.feitos))     state.feitos = [];
  if(!Array.isArray(state.bolsaItens)) state.bolsaItens = BOLSA.map(b=>({...b}));
  if(!Array.isArray(state.bolsa))      state.bolsa = [];
  if(!Array.isArray(state.nomesLista)) state.nomesLista = NOMES.map(n=>({...n}));
  if(!Array.isArray(state.nomes))      state.nomes = [];
  if(!state.parto || typeof state.parto !== "object") state.parto = {};
  if(!(state.meta > 0)) state.meta = 9000;
  if(!state.dpp) state.dpp = dppPadrao();
  if(!state.enxoval.some(c=>c.cat === state.catAberta) && state.catAberta !== "Tudo") state.catAberta = state.enxoval[0].cat;
  state.itemAberto = null;
  state.tela = TABS.some(t=>t[0] === state.tela) || ["orcamento","bolsa","nomes","parto"].includes(state.tela) ? state.tela : "home";
}
function save(){
  const {enxoval, feitos, bolsa, nomes, parto, agenda, meta, dpp, catAberta, tela} = state;
  try{ localStorage.setItem(CHAVE, JSON.stringify({enxoval, feitos, bolsa, nomes, parto, agenda, meta, dpp, catAberta, tela})); }catch(e){}
}

/* ==================================================================
   CAMADA 3 — MOTOR (funções puras)
   ================================================================== */
const BRL = n => "R$ " + Math.round(n).toLocaleString("pt-BR");
const todos = () => state.enxoval.flatMap(c=>c.itens);
const totalMeta = () => todos().reduce((s,i)=>s + i.meta, 0);
const totalTem  = () => todos().reduce((s,i)=>s + Math.min(i.tem, i.meta), 0);
const faltamEssenciais = () => todos().filter(i=>i.ess && i.tem < i.meta).length;
const gasto     = () => todos().reduce((s,i)=>s + Math.min(i.tem, i.meta) * i.preco, 0);
const restante  = () => todos().reduce((s,i)=>s + Math.max(0, i.meta - i.tem) * i.preco, 0);

function gestacao(){
  const dpp = new Date(state.dpp + "T00:00:00");
  const dias = Math.round((dpp - hoje())/86400000);
  const semana = Math.min(42, Math.max(1, 40 - Math.ceil(dias/7)));
  const trimestre = semana <= 13 ? "1º" : semana <= 27 ? "2º" : "3º";
  return {dias, semana, trimestre, nasceu: dias < 0, pct: Math.min(100, Math.round(semana/40*100))};
}
function dataCurta(iso){
  const d = new Date(iso + "T00:00:00");
  return `${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`;
}
function textoDaSemana(sem){
  return (SEMANAS.slice().reverse().find(s=>s.n <= sem) || SEMANAS[0]).texto;
}
function itemPorNome(nome){ return todos().find(i=>i.nome === nome) || null; }
function catDoItem(nome){ return (state.enxoval.find(c=>c.itens.some(i=>i.nome === nome)) || {}).cat; }
function itensVisiveis(){
  return state.catAberta === "Tudo" ? todos()
    : ((state.enxoval.find(c=>c.cat === state.catAberta) || {}).itens || []);
}
function proximaConsulta(){
  const a = state.agenda.find((x,k)=>!state.feitos.includes(k)) || state.agenda[0];
  return a ? {quando: `${Number(a.dia)} ${a.mes}`, desc: a.titulo} : {quando:"a marcar", desc:"Nenhuma consulta na agenda"};
}

/* ==================================================================
   CAMADA 4 — RENDER (cada função devolve string; só render() escreve)
   ================================================================== */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const ic = (nome, tam, cor) =>
  `<svg class="ic" style="font-size:${tam}px${cor?`;color:${cor}`:""}" aria-hidden="true"><use href="#i-${nome}"></use></svg>`;
const kicker = (txt, cls="") => `<div class="kicker ${cls}">${esc(txt)}</div>`;
const voltarMais = `<button class="voltar" data-action="nav" data-tela="mais">← Mais</button>`;

    ${SEMANAS.map(s=>{
      const cor = s.n === sem ? "var(--color-accent)" : (s.n < sem ? "var(--color-neutral-500)" : "var(--color-text)");
      return `<div style="display:flex; gap:16px; align-items:flex-start">
        <div style="width:44px; flex:0 0 44px; text-align:right">
          <div class="h1" style="font-size:24px; line-height:1; color:${cor}">${s.n}</div>
          <div style="font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--color-neutral-500); margin-top:3px">sem</div>
        </div>
        <div style="flex:1">
          <div class="h1" style="font-size:18px; line-height:1.2; color:${cor}">${esc(s.titulo)}</div>
          <div style="font-size:14px; line-height:1.5; color:var(--color-neutral-600); margin-top:4px">${esc(s.texto)}</div>
        </div>
      </div>`;
    }).join("")}
  </div>
  <div style="height:20px"></div>`;
}

/* ---------- Saúde ---------- */
function telaSaude(){
  return `
  ${kicker("Saúde")}
  <div class="h-tela">Consultas,<br>exames e vacinas</div>
  <div class="lista" style="gap:22px; margin-top:28px">
    ${state.agenda.length ? state.agenda.map((a,k)=>{
      const feito = state.feitos.includes(k);
      const cor = feito ? "var(--color-neutral-500)" : "var(--color-text)";
      return `<div style="display:flex; gap:14px; align-items:flex-start">
        <button data-action="editar-consulta" data-i="${k}" style="width:46px; flex:0 0 46px; background:none; padding:0; text-align:left">
          <span class="h1" style="display:block; font-size:22px; line-height:1">${esc(a.dia)}</span>
          <span style="display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--color-neutral-500)">${esc(a.mes)}</span>
        </button>
        <button data-action="editar-consulta" data-i="${k}" style="flex:1; background:none; padding:0; text-align:left">
          <span class="h1" style="display:block; font-size:18px; line-height:1.2; color:${cor}">${esc(a.titulo)}</span>
          <span style="display:block; font-size:13px; color:var(--color-neutral-600); margin-top:3px">${esc(a.desc)}</span>
        </button>
        <button data-action="feito" data-i="${k}" style="background:none; padding:0"
          aria-label="${feito ? "Desmarcar" : "Marcar como feita"}">${ic(feito ? "check-circle" : "circle-dashed", 24, cor)}</button>
      </div>`;
    }).join("") : `<div style="font-size:15px; color:var(--color-neutral-600)">Nenhuma consulta na agenda ainda.</div>`}
  </div>
  <button class="btn btn-secondary btn-block" data-action="nova-consulta" style="margin-top:30px">+ Nova consulta</button>
  <div style="height:20px"></div>`;
}

/* ---------- Formulários (camada de cima) ---------- */
function campo(rot, campoId, ph, extra=""){
  return `<div class="field" style="${extra}"><label>${esc(rot)}</label>
    <input class="input" data-campo="${campoId}" placeholder="${esc(ph)}" value="${esc(form[campoId] ?? "")}" autocomplete="off"></div>`;
}
function formItem(){
  const cats = state.enxoval.map(c=>c.cat);
  const catSel = form.cat || cats[0];
  const essSel = form.ess || "sim";
  return `
  <button class="voltar" data-action="fechar-form">Cancelar</button>
  <div class="h1" style="font-size:30px; line-height:1.1; margin-top:14px">Item do enxoval</div>
  ${campo("O que é","nome","ex: body manga curta","margin-top:22px")}
  <div style="margin-top:18px">
    ${kicker("Categoria","kicker-n")}
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px">
      ${cats.map(c=>`<button class="tag ${c === catSel ? "tag-accent" : "tag-outline"}"
        data-action="form-cat" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}
    </div>
  </div>
  <div style="display:flex; gap:12px; margin-top:18px">
    ${campo("Quero","qtd","6","flex:1")}
    ${campo("Já tenho","tem","0","flex:1")}
    ${campo("Tamanho","tam","RN","flex:1")}
  </div>
  <div style="display:flex; gap:12px; margin-top:18px">
    ${campo("Preço (R$)","preco","35","flex:1")}
    ${campo("Onde comprar","loja","loja","flex:1.4")}
  </div>
  <div style="margin-top:18px">
    ${kicker("Prioridade","kicker-n")}
    <div style="display:flex; gap:8px; margin-top:8px">
      ${[["sim","Essencial"],["nao","Pode esperar"]].map(([v,r])=>`
        <button class="tag ${essSel === v ? "tag-accent" : "tag-outline"}" data-action="form-ess" data-v="${v}">${r}</button>`).join("")}
    </div>
  </div>
  <button class="btn btn-primary btn-block" data-action="salvar-item" style="margin-top:30px">Salvar item</button>
  <div style="height:24px"></div>`;
}
function formConsulta(){
  return `
  <button class="voltar" data-action="fechar-form">Cancelar</button>
  <div class="h1" style="font-size:30px; line-height:1.1; margin-top:14px">Consulta ou exame</div>
  ${campo("O que é","titulo","ex: ultrassom","margin-top:22px")}
  <div style="display:flex; gap:12px; margin-top:18px">
    ${campo("Dia","dia","28","flex:1")}
    ${campo("Mês","mes","ago","flex:1")}
  </div>
  ${campo("Detalhes","desc","médica, horário, local","margin-top:18px")}
  <button class="btn btn-primary btn-block" data-action="salvar-consulta" style="margin-top:30px">Salvar na agenda</button>
  ${form.idx !== undefined ? `<button class="btn btn-ghost btn-block" data-action="apagar-consulta" style="margin-top:10px">Apagar da agenda</button>` : ""}
  <div style="height:24px"></div>`;
}
function formGestacao(){
  return `
  <button class="voltar" data-action="fechar-form">Cancelar</button>
  <div class="h1" style="font-size:30px; line-height:1.1; margin-top:14px">Sua gestação</div>
  <div style="font-size:14px; color:var(--color-neutral-600); margin-top:10px">
    A semana, a contagem e o texto da home saem daqui.</div>
  <div class="field" style="margin-top:22px"><label>Data prevista do parto</label>
    <input class="input" type="date" data-campo="dpp" value="${esc(form.dpp || state.dpp)}"></div>
  ${campo("Orçamento planejado (R$)","meta","9000","margin-top:18px")}
  <button class="btn btn-primary btn-block" data-action="salvar-gestacao" style="margin-top:30px">Salvar</button>
  <div style="height:24px"></div>`;
}

/* ---------- Dispatcher ---------- */
const TELAS = {home:telaHome, enxoval:telaEnxoval, gravidez:telaGravidez, saude:telaSaude,
  mais:telaMais, orcamento:telaOrcamento, bolsa:telaBolsa, nomes:telaNomes, parto:telaParto};
const FORMS = {item:formItem, consulta:formConsulta, gestacao:formGestacao};

function renderTopo(){
  const g = gestacao();
  document.getElementById("topDpp").textContent = dataCurta(state.dpp);
  document.getElementById("topSem").textContent = g.nasceu ? "nasceu" : `sem ${g.semana}/40`;
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TABS.map(([id,rotulo,icone])=>`
    <button class="tab ${state.tela === id && !state.itemAberto ? "on" : ""}" data-action="nav" data-tela="${id}">
      ${ic(icone,22)}<span class="lbl">${rotulo}</span>
    </button>`).join("");
}
function renderOverlay(){
  const el = document.getElementById("overlay");
  el.innerHTML = formTipo ? `<div class="overlay">${FORMS[formTipo]()}</div>` : "";
}
function render(){
  renderTopo();
  renderTabs();
  const fn = state.itemAberto ? telaItem : (TELAS[state.tela] || telaHome);
  document.getElementById("tela").innerHTML = fn();
  renderOverlay();
}
function navTo(tela){
  state.tela = tela;
  state.itemAberto = null;
  save();
  render();
  document.getElementById("tela").scrollTop = 0;
}

/* ==================================================================
   CAMADA 5 — ACTIONS (um mapa + delegação de eventos)
   ================================================================== */
function abrirForm(tipo, base){ formTipo = tipo; form = base || {}; render(); }
function fecharForm(){ formTipo = null; form = {}; render(); }

function salvarItem(){
  if(!form.nome || !String(form.nome).trim()) return fecharForm();
  const cats = state.enxoval.map(c=>c.cat);
  const cat  = form.cat || cats[0];
  const num  = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isNaN(n) ? null : n; };
  const novo = {
    nome: String(form.nome).trim(),
    tam:  (form.tam && String(form.tam).trim()) || "—",
    meta: Math.max(1, Math.round(num(form.qtd) ?? 1)),
    tem:  Math.max(0, Math.round(num(form.tem) ?? 0)),
    preco:Math.max(0, num(form.preco) ?? 0),
    loja: (form.loja && String(form.loja).trim()) || "a definir",
    ess:  form.ess !== "nao",
  };
  const antigo = form.original;
  state.enxoval = state.enxoval.map(c=>{
    const itens = c.itens.filter(i=>i.nome !== novo.nome && i.nome !== antigo);
    return c.cat === cat ? {...c, itens:[...itens, novo]} : {...c, itens};
  });
  state.catAberta = cat;
  state.itemAberto = null;
  save();
  fecharForm();
}
function apagarItem(nome){
  state.enxoval = state.enxoval.map(c=>({...c, itens: c.itens.filter(i=>i.nome !== nome)}));
  state.itemAberto = null;
  save();
  fecharForm();
}
function salvarConsulta(){
  if(!form.titulo || !String(form.titulo).trim()) return fecharForm();
  const nova = {
    dia: String(form.dia || "").trim().padStart(2,"0") || "01",
    mes: (form.mes && String(form.mes).trim().toLowerCase()) || MESES[hoje().getMonth()],
    titulo: String(form.titulo).trim(),
    desc: (form.desc && String(form.desc).trim()) || "",
  };
  state.agenda = form.idx === undefined ? [...state.agenda, nova]
    : state.agenda.map((a,k)=> k === Number(form.idx) ? nova : a);
  save();
  fecharForm();
}
function apagarConsulta(){
  const idx = Number(form.idx);
  state.agenda = state.agenda.filter((a,k)=>k !== idx);
  state.feitos = state.feitos.filter(k=>k !== idx).map(k=>k > idx ? k - 1 : k);
  save();
  fecharForm();
}

const ACTIONS = {
  "nav":(d)=>navTo(d.tela),
  "cat":(d)=>{ state.catAberta = d.cat; save(); render(); },

  "abrir-item":(d)=>{ state.itemAberto = d.nome; render(); document.getElementById("tela").scrollTop = 0; },
  "fechar-item":()=>{ state.itemAberto = null; state.tela = "enxoval"; save(); render(); },
  "ajustar":(d)=>{
    const passo = Number(d.d);
    state.enxoval = state.enxoval.map(c=>({...c, itens: c.itens.map(i=>
      i.nome === state.itemAberto ? {...i, tem: Math.max(0, i.tem + passo)} : i)}));
    save(); render();
  },
  "novo-item":()=>abrirForm("item", {
    cat: state.catAberta === "Tudo" ? state.enxoval[0].cat : state.catAberta, qtd:"1", tem:"0"}),
  "editar-item":()=>{
    const i = itemPorNome(state.itemAberto); if(!i) return;
    abrirForm("item", {original:i.nome, nome:i.nome, tam:i.tam, qtd:String(i.meta), tem:String(i.tem),
      preco:String(i.preco), loja:i.loja, ess: i.ess ? "sim" : "nao", cat: catDoItem(i.nome)});
  },
  "apagar-item":()=>apagarItem(state.itemAberto),
  "form-cat":(d)=>{ form.cat = d.cat; renderOverlay(); },
  "form-ess":(d)=>{ form.ess = d.v; renderOverlay(); },
  "salvar-item":()=>salvarItem(),
  "fechar-form":()=>fecharForm(),

  "nova-consulta":()=>abrirForm("consulta", {mes: MESES[hoje().getMonth()]}),
  "editar-consulta":(d)=>{
    const a = state.agenda[Number(d.i)]; if(!a) return;
    abrirForm("consulta", {idx:Number(d.i), dia:a.dia, mes:a.mes, titulo:a.titulo, desc:a.desc});
  },
  "salvar-consulta":()=>salvarConsulta(),
  "apagar-consulta":()=>apagarConsulta(),
  "feito":(d)=>{
    const k = Number(d.i);
    state.feitos = state.feitos.includes(k) ? state.feitos.filter(x=>x !== k) : [...state.feitos, k];
    save(); render();
  },

  "bolsa":(d)=>{
    state.bolsa = state.bolsa.includes(d.nome) ? state.bolsa.filter(x=>x !== d.nome) : [...state.bolsa, d.nome];
    save(); render();
  },
  "add-bolsa":()=>{
    const v = novaBolsa.trim(); if(!v) return;
    if(!state.bolsaItens.some(b=>b.nome === v)) state.bolsaItens = [...state.bolsaItens, {nome:v, grupo:"Adicionado por você"}];
    novaBolsa = ""; save(); render();
  },
  "fav-nome":(d)=>{
    state.nomes = state.nomes.includes(d.nome) ? state.nomes.filter(x=>x !== d.nome) : [...state.nomes, d.nome];
    save(); render();
  },
  "add-nome":()=>{
    const v = novoNome.trim(); if(!v) return;
    if(!state.nomesLista.some(n=>n.nome === v)) state.nomesLista = [...state.nomesLista, {nome:v, significado:"seu favorito"}];
    novoNome = ""; save(); render();
  },
  "parto":(d)=>{ state.parto = {...state.parto, [d.tema]: d.opcao}; save(); render(); },

  "abrir-gestacao":()=>abrirForm("gestacao", {dpp: state.dpp, meta: String(state.meta)}),
  "salvar-gestacao":()=>{
    if(form.dpp && !isNaN(new Date(form.dpp + "T00:00:00"))) state.dpp = form.dpp;
    const m = parseFloat(String(form.meta ?? "").replace(",", "."));
    if(!isNaN(m) && m > 0) state.meta = m;
    save(); fecharForm();
  },
};

document.addEventListener("click",(e)=>{
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const fn = ACTIONS[el.dataset.action];
  if(fn){ e.preventDefault(); fn(el.dataset); }
});
document.addEventListener("input",(e)=>{
  const t = e.target;
  if(t.dataset && t.dataset.campo){ form[t.dataset.campo] = t.value; return; }   /* sem re-render ao digitar */
  if(t.id === "inBolsa"){ novaBolsa = t.value; return; }
  if(t.id === "inNome"){ novoNome = t.value; return; }
});
document.addEventListener("keydown",(e)=>{
  if(e.key === "Escape" && formTipo) fecharForm();
  if(e.key === "Enter"){
    if(e.target.id === "inBolsa"){ e.preventDefault(); ACTIONS["add-bolsa"](); }
    if(e.target.id === "inNome"){ e.preventDefault(); ACTIONS["add-nome"](); }
    if(formTipo && e.target.dataset && e.target.dataset.campo){
      const primario = document.querySelector("#overlay .btn-primary[data-action]");
      if(primario){ e.preventDefault(); primario.click(); }
    }
  }
});

/* ==================================================================
   CAMADA 6 — INIT
   ================================================================== */
function init(){
  load();
  save();
  render();

  /* dev check: os dados de parto salvos precisam existir na lista de temas */
  const temas = PARTO.map(p=>p.tema);
  const bad = Object.keys(state.parto).filter(t=>!temas.includes(t));
  if(bad.length) console.warn("Temas de parto desconhecidos:", bad);
}
init();

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
